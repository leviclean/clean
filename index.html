tions** désigne les campagnes de promotion des Marques utilisant la Solution.\\n\\n**Panne** désigne un incident technique empêchant l’accès ou l’utilisation de la plateforme dans de bonnes conditions.\\n\\n**Smart Contract** désigne le contrat intelligent sous la forme de code informatique permettant d’opérer des transactions sur la blockchain.\\n\\n**Solution** désigne la solution technologique éditée par Cohort permettant notamment la création et le suivi d\'Opérations par les Marques.\\n\\n**Utilisateurs** désigne les clients des Marques, participant aux Opérations par l’intermédiaire de la Solution.\\n\\n## 2. Objet et champ d’application\\n\\nLes présentes CGU ont pour objet de définir les conditions d’accès et d’utilisation sécurisée de la Solution par les Utilisateurs.\\n\\nCohort agit en tant que simple intermédiaire technique entre les Marques et les Utilisateurs et son rôle se limite à la gestion de la Solution. Ainsi, Cohort n\'est jamais partie aux Opérations effectuées par les Marques. De la même façon, les Avantages et les NFT sont émis et vendus par les Marques aux Utilisateurs et jamais par Cohort.\\n\\nPar conséquent, les CGU ne régissent pas les relations, de quelque nature qu’elles soient, entre les Marques et les Utilisateurs.\\n\\n## 3. Acceptation et modification\\n\\n#### Acceptation\\n\\nLes CGU sont accessibles à tout moment sur la Solution et s\'appliquent à toute interaction avec la Solution. Elles prévaudront sur toute autre version ou tout autre document contradictoire.\\n\\nLes Utilisateurs s\'engagent à lire et à accepter pleinement et sans réserve les présentes CGU, en cochant la case correspondante.\\n\\n#### Modification des CGU\\n\\nAfin d\'améliorer les caractéristiques et la qualité de la Solution, Cohort peut ajouter, supprimer ou remplacer certaines fonctionnalités à tout moment.\\n\\nPar conséquent, Cohort peut modifier les CGU en cas de besoin et mettra en œuvre ses meilleurs efforts pour informer les Utilisateurs des modifications préalablement à leur entrée en vigueur.\\n\\nEn cas de modification substantielle (incluant la suppression d’une fonctionnalité) affectant les Utilisateurs, Cohort s’engage à les informer dans un délai raisonnable préalablement à l’entrée en vigueur desdites modifications. Pendant cette période, l\'Utilisateur peut résilier son compte, à condition de respecter les engagements qu\'il a déjà pris.\\n\\n#### Accès à la Solution\\n\\nLa Solution est intégrée aux comptes des Utilisateurs auprès des Marques. Lors de sa connexion, l\'Utilisateur doit fournir toutes les informations requises par Cohort et par la Marque. Toute inscription incomplète ne sera pas validée. Cohort se réserve le droit de vérifier les informations fournies et de refuser toute demande invalide et/ou incomplète. L\'Utilisateur ne pourra prétendre à aucune indemnité à ce titre.\\n\\nEn interagissant avec la Solution, les Utilisateurs garantissent être des personnes physiques ayant la qualité de consommateur au sens de l\'article liminaire du code de la consommation et ayant la pleine capacité juridique de s\'engager au titre des présentes CGU.\\n\\nPar ailleurs, l’accès à la Solution est conditionné par la conformité aux politiques applicables des Marques. Cohort ne saurait être tenu responsable d’un refus d’inscription ou de vente lié à un manquement aux politiques des Marques.\\n\\n#### Engagements de Cohort\\n\\n##### Garanties liées à l’opération de la Solution\\n\\nCohort fournit ses meilleurs efforts pour fournir la Solution et en assurer l\'accessibilité et le bon fonctionnement.\\n\\nÀ cet effet, Cohort s\'engage à faire en sorte que la Solution soit accessible 24 heures sur 24, 7 jours sur 7, sauf en cas de force majeure ou de comportement imprévisible et inévitable d\'un tiers et sous réserve des éventuelles pannes, interventions de maintenance et mises à jour nécessaires au bon fonctionnement de la Solution.\\n\\nEn raison des caractéristiques propres à internet et aux réseaux de télécommunications, Cohort ne peut être tenu qu’à une obligation de moyens.\\n\\nEn particulier, sauf disposition légale ou réglementaire contraire, Cohort ne peut être tenu pour responsable en cas de :\\n\\n* pannes, dysfonctionnements ou cyberattaques ne relevant pas de sa responsabilité ;\\n\\n* tout dysfonctionnement ou difficulté technique ou informatique ne relevant pas de sa responsabilité, y compris liée à la Blockchain sous-jacente ;\\n\\n* perte de données des Utilisateurs non imputables à Cohort, notamment, mais pas exclusivement, en cas de piratage ou d\'hameçonnage du compte de l\'Utilisateur, en raison d\'une négligence dans la sécurisation de ses identifiants ;\\n\\n* l\'utilisation inhabituelle ou illégale de la Solution par un Utilisateur, une Marque ou tout autre tiers ;\\n\\n* tout cas de force majeure, au sens de l\'article 1218 du Code civil et de la jurisprudence associée.\\n\\n##### Absence de garanties liées aux Opérations et Avantages\\n\\nCohort ne fournit aucune garantie et ne se prononce pas sur la légitimité, l\'authenticité, le sérieux, le professionnalisme des Marques ou des Opérations qu\'elles mettent en œuvre.\\n\\nEn conséquence, Cohort ne saurait être responsable :\\n\\n* des contenus des Marques publiés sur la Solution qui contreviendraient aux dispositions législatives ou réglementaires applicables ou qui causerait un quelconque préjudice à un Utilisateur ou à un tiers, sauf à ce que Cohort soit notifié de ce contenu dans les conditions prévues à l\'article 8 ;\\n\\n* de la qualité ou de la conformité des Avantages offerts par les Marques via la Solution.\\n\\nLes risques spécifiques liés au service NFT sont décrits en Annexe 1.\\n\\n## 4. Accès à la Solution\\n\\nLa Solution est intégrée aux comptes des Utilisateurs auprès des Marques. Lors de sa connexion, l\'Utilisateur doit fournir toutes les informations requises par Cohort et par la Marque. Toute inscription incomplète ne sera pas validée. Cohort se réserve le droit de véri lisateur ne pourra plus accéder à la Solution, à moins d\'accepter à nouveau les CGU.\\n\\nDans le cas d\'un changement de la réglementation applicable et de l\'interprétation qui en est faite par l\'autorité réglementaire compétente, affectant la capacité de Cohort ou de ses employés à exploiter la Solution, les CGU seront automatiquement résiliées.\\n\\nSans préjudice de toute autre action, Cohort peut résilier ces CGU et bloquer l\'accès de l\'Utilisateur à la Solution en cas de violation matérielle de ces CGU et en particulier les engagements contenus à l’article 6.\\n\\nLa résiliation des CGU n\'entraînera en aucun cas une compensation de Cohort à un Utilisateur.\\n\\n## 9. Hyperliens\\n\\nLa Solution peut contenir des liens ou du contenu redirigeant vers des sites web ou des ressources de tiers, qui peuvent être soumis à des politiques différentes.\\n\\nCohort n\'est pas responsable du contenu disponible à travers ces liens. La présence de tels liens ne constitue pas une approbation des services tiers par Cohort.\\n\\n## 10. Propriété intellectuelle\\n\\nLa Solution et toutes ses fonctionnalités et plus largement tout contenu généré par Cohort sont la seule propriété intellectuelle de Cohort ou de la Marque et sont protégées par tous les droits de propriété intellectuelle en vigueur.\\n\\nSous réserve du respect par l\'Utilisateur des présentes CGU et de toute autre condition applicable, Cohort lui accorde par la présente une licence strictement personnelle et individuelle, pour le monde entier, limitée, non exclusive, non transférable, non sous-licenciable et révocable, d\'accès et d\'utilisation de la Solution. Cette licence est accordée pour toute la durée de l\'utilisation conforme de la Solution par l\'utilisateur et sera automatiquement résiliée avec les CGU.\\n\\nLes Utilisateurs comprennent que cette licence n\'accorde pas plus de droits que ceux exprimés dans les présentes et, en particulier, ne permet pas la reproduction ou la représentation sous que es Utilisateurs.\\n\\n## 14. Litiges et médiation\\n\\n#### Litige\\n\\nTout litige relatif à l\'utilisation de la Solution et des Services doit être soumis à Cohort en envoyant un courrier électronique à <support@cohort.xyz>.\\n\\n#### Service de médiation de la Commission européenne\\n\\nConformément à l\'article L.616-2 du Code de la consommation, les Utilisateurs peuvent recourir au service de médiation de la Commission européenne qui a pour objet de recueillir les réclamations des consommateurs de l\'Union européenne et de transmettre leur dossier à des médiateurs nationaux. Ce service est accessible par le lien suivant : ec.europa.eu/consumers.\\n\\n## 15. Droit applicable et juridiction compétente\\n\\nLes CGU sont régies et interprétées conformément au droit français, et relèvent de la compétence des tribunaux français.\\n\\nSauf disposition légale contraire, tout conflit ou litige relatif à la validité, l\'interprétation, l\'exécution et/ou la résiliation des CGU sera soumis aux tribunaux compétents.\\n\\n## 16. Annexe I\\n\\nAvertissement sur les risques liés à l’achat de NFT\\n\\nEn achetant des NFT aux Marques par l\'intermédiaire de la Solution, les Utilisateurs garantissent qu\'ils ont lu et compris les risques suivants.\\n\\n#### Risque technologique\\n\\nLes Utilisateurs doivent être conscients des risques techniques liés aux NFTs, y compris les risques découlant d\'une erreur ou d\'un défaut de sécurité associé à la Blockchain, qui peut entraîner une perte de données ou une perte d\'accès aux NFT.\\n\\nCela peut résulter d\'une erreur ou d\'une défaillance de sécurité associée à la Blockchain et au smart contract, permettant et/ou entraînant le piratage et le vol de données sur la Solution, y compris, mais sans s\'y limiter, les attaques Sybil. Dans le cas où cette erreur ou défaillance relève de la plateforme Cohort, Cohort fera son possible pour corriger l’erreur ou la défaillance dans les meilleurs délais.\\n\\n#### Risque économique\\n\\nLes Utilisateurs sont conscients que les NFT sont des actifs dont la valeur n\'est pas intrinsèquement garantie et dépend de marchés non réglementés. En achetant les NFT aux Marques, les Utilisateurs sont exposés à des risques élevés de perte de valeur.\\n\\n#### Risque légal\\n\\nLes Utilisateurs comprennent que le cadre juridique des NFT varie en fonction de la juridiction dans laquelle ils se trouvent et que les NFT peuvent être interdits ou soumis à un cadre réglementaire susceptible d\'en diminuer la valeur de manière significative ou totale.\\n\\nAinsi, Cohort n\'émet aucune garantie s\'agissant des droits de propriété intellectuelle attachés aux NFT ou sur la qualification juridique des NFT.","id":"fr/fr","code":"fr","iso":"fr_FR"},"de/de":{"copy":"de","language":"de","region":"de","name":"Deutschland (DE)","terms_url":"https://www.lacoste.com/de/co-creative-challenge-terms-and-conditions-fw26.html","gdpr":"Lacoste S.A.S., Verantwortlicher im Sinne der DSGVO, verarbeitet Ihre personenbezogenen Daten (Vorname, Nachname, EGeburtsdatum, E-Mail-Adresse, Telefonnummer, Geschlecht (optional) und Wohnsitzland) zum Zweck der Organisation des Gewinnspiels, das über Mobilgeräte und Tablets zugänglich ist. Ihre Teilnahme setzt das Ausfüllen des Registrierungsformulars und Ihre Einwilligung voraus. Die erhobenen Daten werden ausschließlich zur ordnungsgemäßen Durchführung des Gewinnspiels verwendet und nach dessen Ende gelöscht, es sei denn, gesetzliche Pflichten oder die Bearbeitung möglicher Ansprüche erfordern eine längere Aufbewahrung.Ihre Daten können in streng begrenztem Umfang an Tochtergesellschaften von Lacoste und an Dienstleister, die an der Organisation beteiligt sind, weitergegeben werden.Sie haben das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Widerspruch, Datenübertragbarkeit sowie das Recht, Anweisungen für die Verwendung Ihrer Daten nach Ihrem Tod festzulegen (soweit anwendbar). Diese Rechte können Sie über das Kontaktformular (von der offiziellen Website von Lacoste) unter Auswahl von „Personenbezogene Daten“ ausüben. Sie haben außerdem das Recht, eine Beschwerde bei der <strong>zuständigen Aufsichtsbehörde in Deutschland (z. B. Landesdatenschutzbehörde Ihres Bundeslandes)</strong> einzureichen. Weitere Informationen finden Sie in unserer <a target=\\"_blank\\" rel=\\"noreferrer noopener nofollow\\" href=\\"https://www.lacoste.com/de/privacy.html\\">Datenschutzrichtlinie</a>.","optin_legal":"Ich stimme der Teilnahme am Gewinnspiel zu und akzeptiere damit die Teilnahmebedingungen des Gewinnspiels.","optin_member":"Ich stimme der Anmeldung zum Lacoste-Treueprogramm zu, sofern ich noch kein Mitglied bin. Durch Ankreuzen dieses Kästchens willige ich ein, dass meine übermittelten personenbezogenen Daten verwendet werden, damit ich meine Angebote und exklusiven Mitgliedervorteile erhalte und über Neuigkeiten der Marke informiert werde","privacy_link":"https://www.lacoste.com/de/privacy.html","legals_content":"## 1. Begriffsbestimmungen\\n\\nUnvoreingenommen hinsichtlich anderer Definitionen in diesen Nutzungsbedingungen („Bedingungen“) haben die nachstehend definierten Begriffe die ihnen zugewiesene Bedeutung, in Einzahl oder Mehrzahl.\\n\\n**Leistungen:** Bezieht sich auf die digitalen oder physischen Hilfsmittel, die von der Brand den Nutzern als Teil der Operationen angeboten oder verkauft werden und die mit einem NFT verbunden sein können.\\n\\n**Nutzungsbedingungen und -bestimmungen:** Bezieht sich auf die Allgemeinen Geschäftsbedingungen für die Nutzung der Plattform.\\n\\n**Unternehmen:** Bezieht sich auf das Unternehmen, das in den rechtlichen Hinweisen genannt ist.\\n\\n**Konto:** Bezieht sich auf das Konto, das der Nutzer bei seiner Registrierung auf der Plattform erstellt hat.\\n\\n**Brands:** Bezieht sich auf professionelle juristische Organisationen, die Operationen über die Lösung durchführen.\\n\\n**NFT:** Bezieht sich auf nicht-fungible Token, die mit den Standards ERC-721 und ERC-1115 oder anderen ähnlichen Standards konform sind und auf einer Blockchain gespeichert werden.\\n\\n**Operationen:** Bezieht sich auf die Werbekampagnen, die von Brands unter Verwendung der Lösung durchgeführt werden.\\n\\n**Störung:** Bezieht sich auf ein technisches Problem, das den ordnungsgemäßen Zugang zur oder die Nutzung der Plattform verhindert.\\n\\n**Smart Contract:** Bezieht sich auf den intelligenten Vertrag in Form von Computercode, der die Transaktionen auf der Blockchain erleichtert.\\n\\n**Lösung:** Bezieht sich auf die von dem Unternehmen entwickelte technologische Lösung, die es Marken ermöglicht, Operationen zu erstellen und zu verfolgen.\\n\\n**Nutzer:** Bezieht sich auf die Kunden der Brands, die über die Lösung an den Operationen teilnehmen.\\n\\n## 2. Zweck und Anwendungsbereich\\n\\nDie vorliegenden Bestimmungen sollen die Bedingungen für den sicheren Zugang und die Nutzung der Lösung durch die Nutzer festlegen.\\n\\nDas Unternehmen agiert als technischer Vermittler zwischen den Brands und den Nutzern, wobei sich seine Rolle auf die Verwaltung der Lösung beschränkt. Folglich ist das Unternehmen niemals ein Teil der von den Brands durchgeführten Transaktionen. Ebenfalls werden die Vorteile und NFTs von den Brands an die Nutzer ausgegeben und verkauft, niemals aber von dem Unternehmen.\\n\\nDaher regeln die vorliegenden Bedingungen keinerlei Beziehung zwischen den Brands und den Nutzern.\\n\\n## 3. Annahme und Änderungen\\n\\n#### Annahme\\n\\nDie Bedingungen sind jederzeit über die Lösung zugänglich und gelten für alle Interaktionen mit der Lösung. Sie haben Vorrang vor allen anderen Versionen oder widersprüchlichen Dokumenten.\\n\\nDie Nutzer stimmen zu, diese Bedingungen zu lesen, vollständig zu akzeptieren und einzuhalten, indem sie das entsprechende Kästchen ankreuzen.\\n\\n#### Änderungen der Bedingungen\\n\\nUm die Funktionen und die Qualität der Lösung zu verbessern, kann das Unternehmen jederzeit Funktionalitäten hinzufügen, entfer t das Unternehmen eine Verpflichtung der Mittel, nicht der Ergebnisse.\\n\\nDas Unternehmen ist nicht haftbar für:\\n\\n* Ausfälle, Fehlfunktionen oder Cyberangriffe, die sich seiner Kontrolle entziehen.\\n\\n* Technische oder IT-Probleme, die nicht mit dem Betrieb von dem Unternehmen zusammenhängen, einschließlich solcher, die die zugrunde liegende Blockchain betreffen.\\n\\n* Verlust von Nutzerdaten, der nicht dem Unternehmen zuzuschreiben ist, wie z. B. Phishing oder Hacking aufgrund von Fahrlässigkeit des Nutzers.\\n\\n* Unbefugte oder illegale Nutzung der Lösung durch Nutzer, Marken oder Dritte.\\n\\n* Ereignisse höherer Gewalt im Sinne des französischen Rechts (Artikel 1218 des Zivilgesetzbuchs).\\n\\n#### Keine Garantien in Bezug auf Transaktionen und Vorteile\\n\\nDas Unternehmen garantiert oder bewertet nicht die Legitimität, Authentizität, Seriosität oder Professionalität der Marken oder ihrer Tätigkeiten.\\n\\nDas Unternehmen kann nicht haftbar gemacht werden für:\\n\\n* Von Marken in der Lösung veröffentlichte Inhalte, die gegen Gesetze oder Vorschriften verstoßen oder einem Nutzer oder Dritten Schaden zufügen, es sei denn, das Unternehmen wird wie in Abschnitt 8 beschrieben benachrichtigt.\\n\\n* Die Qualität oder Konformität der von den Marken über die Lösung angebotenen Vorteile.\\n\\n* Die Risiken im Zusammenhang mit NFT-Diensten sind in Anhang I aufgeführt.\\n\\n## 6. Benutzerverpflichtungen\\n\\n#### Benutzerverpflichtungen\\n\\nAls Gegenleistung für die Bereitstellung der Lösung durch das Unternehmen stimmen die Benutzer zu:\\n\\n* Sie müssen mindestens 18 Jahre alt sein oder die Erlaubnis der Eltern oder des gesetzlichen Vertreters haben.\\n\\n* Bei der Interaktion mit der Lösung genaue, wahrheitsgemäße und fehlerfreie Angaben machen und diese Informationen auf dem neuesten Stand halten. Eine Identitätsüberprüfung (z. B. KYC) kann zur Einhaltung der Gesetze zur Bekämpfung der Geldwäsche (AML) erforderlich sein.\\n\\n* Halten Sie die geltenden Ges eendigung führen.\\n\\nDas Unternehmen haftet nicht für Entschädigungen bei Beendigung der Bedingungen.\\n\\n## 9. Geistiges Eigentum\\n\\nDie Lösung und alle ihre Funktionen sind das geistige Eigentum von dem Unternehmen oder Brands. Den Nutzern wird eine nicht-exklusive, nicht übertragbare und widerrufbare Lizenz für den persönlichen Gebrauch gewährt. Das Eigentum an den NFT-Urheberrechten verbleibt bei den Brands.\\n\\n## 10. Persönliche Daten\\n\\nDie Nutzung der Lösung bringt die Erfassung und Verarbeitung personenbezogener Daten durch die Brand in Übereinstimmung mit der GDPR und den französischen Datenschutzgesetzen mit sich.\\n\\n## 11. Streitigkeiten und Schlichtung\\n\\n#### Streitigkeiten\\n\\nStreitigkeiten müssen über <support@cohort.xyz> eingereicht werden. Verbraucher in der EU können auch den Schlichtungsdienst der Europäischen Kommission unter ec.europa.eu/consumers nutzen.\\n\\n#### Geltendes Recht\\n\\nDie Bedingungen unterliegen französischem Recht mit den französischen Gerichten als Zuständige.","id":"de/de","code":"de","iso":"de_DE"},"be/fr":{"copy":"fr","language":"fr","region":"be","name":"Belgique (FR)","terms_url":"https://www.lacoste.com/be/fr/co-creative-challenge-terms-and-conditions-fw26.html","gdpr":"Lacoste S.A.S., responsable du traitement, traite vos données personnelles (nom, prénom, date de naissance adresse e-mail, numéro de téléphone, sexe (facultatif) et pays de résidence) afin d’organiser le jeu concours accessible sur mobile et tablette. Votre participation implique de remplir le formulaire d’inscription et de donner votre consentement.Les données collectées seront utilisées uniquement pour la bonne exécution du jeu et supprimées à l’issue de celui-ci, sauf obligations légales ou nécessité de conserver certaines données pour gérer d’éventuelles réclamations.Vos données peuvent être transmises, de manière strictement limitée, aux filiales de Lacoste et aux prestataires impliqués dans l’organisation du jeu.Vous disposez des droits d’accès, de rectification, d’effacement, de limitation du traitement, d’opposition, de portabilité ainsi que du droit de définir des directives relatives au sort de vos données après votre décès. Vous pouvez exercer vos droits via le formulaire de contact (du site marchand Lacoste) en sélectionnant « Données Personnelles ».Vous disposez également du droit d’introduire une réclamation auprès de l’Autorité de protection des données (APD) en Belgique. Pour plus d’informations, veuillez consulter notre Politique de Confidentialité.","optin_legal":"J\'accepte de participer au jeu concours et par conséquent j\'accepte le règlement du jeu concours","optin_member":"J’accepte de m’inscrire au programme de fidélité Lacoste si je n’en suis pas membre. En cochant cette case, j’accepte que mes données personnelles transmises soient utilisées pour recevoir mes offres, avantages exclusifs membres et être informé des nouveautés de la marque","privacy_link":"https://www.lacoste.com/be/fr/privacy.html","legals_content":"## 1. Définitions\\n\\nSans préjudice des autres définitions figurant dans les Conditions Générales d’Utilisation (les « CGU »), les termes ci-après définis ont à chaque fois qu’ils sont employés avec une majuscule, au singulier ou au pluriel, la signification qui leur est donnée ci-dessous.\\n\\n**Avantages** désigne les utilités digitales ou physiques offerts ou vendus par la Marque aux Utilisateurs dans le cadre des Opérations et pouvant être associées à un NFT.\\n\\n**CGU** réfère aux conditions Générales d’Utilisation de la plateforme.\\n\\n**Cohort** désigne Cohort, société identifiée dans les mentions légales.\\n\\n**Compte** désigne le compte créé par l’Utilisateur lors de son inscription sur la plateforme.\\n\\n**Marques** désigne les personnes morales professionnelles effectuant des Opérations par l’intermédiaire de la Solution.\\n\\n**NFT** désigne les jetons non fongibles conformes aux normes ERC-721 et ERC-1115 ou à une autre norme similaire et stockés sur une Blockchain.\\n\\n**Opérations** désigne les campagnes de promotion des Marques utilisant la Solution.\\n\\n**Panne** désigne un incident technique empêchant l’accès ou l’utilisation de la plateforme dans de bonnes conditions.\\n\\n**Smart Contract** désigne le contrat intelligent sous la forme de code informatique permettant d’opérer des transactions sur la blockchain.\\n\\n**Solution** désigne la solution technologique éditée par Cohort permettant notamment la création et le suivi d\'Opérations par les Marques.\\n\\n**Utilisateurs** désigne les clients des Marques, participant aux Opérations par l’intermédiaire de la Solution.\\n\\n## 2. Objet et champ d’application\\n\\nLes présentes CGU ont pour objet de définir les conditions d’accès et d’utilisation sécurisée de la Solution par les Utilisateurs.\\n\\nCohort agit en tant que simple intermédiaire technique entre les Marques et les Utilisateurs et son rôle se limite à la gestion de la Solution. Ainsi, Cohort n\'est jamais partie aux Opérations effectuées par les Marques. De la même façon, les Avantages et les NFT sont émis et vendus par les Marques aux Utilisateurs et jamais par Cohort.\\n\\nPar conséquent, les CGU ne régissent pas les relations, de quelque nature qu’elles soient, entre les Marques et les Utilisateurs.\\n\\n## 3. Acceptation et modification\\n\\n#### Acceptation\\n\\nLes CGU sont accessibles à tout moment sur la Solution et s\'appliquent à toute interaction avec la Solution. Elles prévaudront sur toute autre version ou tout autre document contradictoire.\\n\\nLes Utilisateurs s\'engagent à lire et à accepter pleinement et sans réserve les présentes CGU, en cochant la case correspondante.\\n\\n#### Modification des CGU\\n\\nAfin d\'améliorer les caractéristiques et la qualité de la Solution, Cohort peut ajouter, supprimer ou remplacer certaines fonctionnalités à tout moment.\\n\\nPar conséquent, Cohort peut modifier les CGU en cas de besoin et mettra en œuvre ses meilleurs efforts pour in vestigation.\\n\\nUsers may delete their accounts at any time, ending their access to the Solution. Regulatory changes affecting Cohort\'s operations may also result in automatic termination.\\n\\nCohort is not liable for compensation upon termination of the Terms.\\n\\n## 9. Intellectual Property\\n\\nThe Solution and all its features are the intellectual property of Cohort or Brands. A non-exclusive, non-transferable, and revocable license is granted to Users for personal use. Ownership of NFT copyrights remains with Brands.\\n\\n## 10. Personal Data\\n\\nThe use of the Solution entails the collection and processing of personal data by the Brand in compliance with GDPR and French data protection laws.\\n\\n## 11. Disputes and Mediation\\n\\n#### Disputes\\n\\nDisputes must be submitted via <support@cohort.xyz>. EU consumers may also use the European Commission’s mediation service at ec.europa.eu/consumers.\\n\\n#### Governing Law\\n\\nFrench law governs the Terms, with French courts holding jurisdiction.","id":"be/nl","code":"nl","iso":"nl_BE"},"ch/fr":{"copy":"fr","language":"fr","region":"ch","name":"Suisse (FR)","terms_url":"https://www.lacoste.com/ch/fr/co-creative-challenge-terms-and-conditions-fw26.html","gdpr":"Lacoste S.A.S., en tant que responsable du traitement, traite vos données personnelles (nom, prénom, date de naissance adresse e-mail, numéro de téléphone, sexe (facultatif) et pays de résidence) afin de gérer l’organisation du jeu concours accessible [sur mobile et tablette]. Votre participation suppose de remplir le formulaire d’inscription et de donner votre consentement.Les données collectées seront utilisées exclusivement pour la bonne exécution du jeu et supprimées à son terme, sauf obligations légales ou nécessité de conservation pour d’éventuelles réclamations.Vos données peuvent être transmises, de manière strictement limitée, aux filiales et prestataires de Lacoste impliqués dans l’organisation du jeu.Conformément à la législation suisse et, le cas échéant, au RGPD, vous disposez de droits d’accès, de rectification, d’effacement, de limitation, d’opposition, de portabilité, ainsi que du droit de définir des instructions relatives au sort de vos données après votre décès. Vous pouvez exercer vos droits via le formulaire de contact (du site marchand Lacoste) en sélectionnant « Données Personnelles ».Vous disposez également du droit d’introduire une réclamation auprès du <strong>Préposé fédéral à la protection des données et à la transparence (PFPDT)</strong>. Pour plus d’informations, veuillez consulter notre <a target=\\"_blank\\" rel=\\"noreferrer noopener nofollow\\" href=\\"https://www.lacoste.com/ch/fr/privacy.html\\">Politique de Confidentialité</a>.","optin_legal":"J\'accepte de participer au jeu concours et par conséquent j\'accepte le règlement du jeu concours","optin_member":"J’accepte de m’inscrire au programme de fidélité Lacoste si je n’en suis pas membre. En cochant cette case, j’accepte que mes données personnelles transmises soient utilisées pour recevoir mes offres, avantages exclusifs membres et être informé des nouveautés de la marque","privacy_link":"https://www.lacoste.com/ch/fr/privacy.html","legals_content":"## 1. Définitions\\n\\nSans préjudice des autres définitions figurant dans les Conditions Générales d’Utilisation (les « CGU »), les termes ci-après définis ont à chaque fois qu’ils sont employés avec une majuscule, au singulier ou au pluriel, la signification qui leur est donnée ci-dessous.\\n\\n**Avantages** désigne les utilités digitales ou physiques offerts ou vendus par la Marque aux Utilisateurs dans le cadre des Opérations et pouvant être associées à un NFT.\\n\\n**CGU** réfère aux conditions Générales d’Utilisation de la plateforme.\\n\\n**Cohort** désigne Cohort, société identifiée dans les mentions légales.\\n\\n**Compte** désigne le compte créé par l’Utilisateur lors de son inscription sur la plateforme.\\n\\n**Marques** désigne les personnes morales professionnelles effectuant des Opérations par l’intermédiaire de la Solution.\\n\\n**NFT** désigne les jetons non fongibles conformes aux normes ERC-721 et ERC-1115 ou à une autre norme similaire et stockés sur une Blockchain.\\n\\n**Opérations** désigne les campagnes de promotion des Marques utilisant la Solution.\\n\\n**Panne** désigne un incident technique empêchant l’accès ou l’utilisation de la plateforme dans de bonnes conditions.\\n\\n**Smart Contract** désigne le contrat intelligent sous la forme de code informatique permettant d’opérer des transactions sur la blockchain.\\n\\n**Solution** désigne la solution technologique éditée par Cohort permettant notamment la création et le suivi d\'Opérations par les Marques.\\n\\n**Utilisateurs** désigne les clients des Marques, participant aux Opérations par l’intermédiaire de la Solution.\\n\\n## 2. Objet et champ d’application\\n\\nLes présentes CGU ont pour objet de définir les conditions d’accès et d’utilisation sécurisée de la Solution par les Utilisateurs.\\n\\nCohort agit en tant que simple intermédiaire technique entre les Marques et les Utilisateurs et son rôle se limite à la gestion de la Solution. Ainsi, Cohort n\'est jamais partie aux Opérations effectuées par les Marques. De la même façon, les Avantages et les NFT sont émis et vendus par les Marques aux Utilisateurs et jamais par Cohort.\\n\\nPar conséquent, les CGU ne régissent pas les relations, de quelque nature qu’elles soient, entre les Marques et les Utilisateurs.\\n\\n## 3. Acceptation et modification\\n\\n#### Acceptation\\n\\nLes CGU sont accessibles à tout moment sur la Solution et s\'appliquent à toute interaction avec la Solution. Elles prévaudront sur toute autre version ou tout autre document contradictoire.\\n\\nLes Utilisateurs s\'engagent à lire et à accepter pleinement et sans réserve les présentes CGU, en cochant la case correspondante.\\n\\n#### Modification des CGU\\n\\nAfin d\'améliorer les caractéristiques et la qualité de la Solution, Cohort peut ajouter, supprimer ou remplacer certaines fonctionnalités à tout moment.\\n\\nPar conséquent, Cohort peut modifier les CGU en cas de besoin et mettra en œuvre ses meilleurs efforts pour informer les Utilisateurs des modifications préalablement à leur entrée en vigueur.\\n\\nEn cas de modification substantielle (incluant la suppression d’une fonctionnalité) affectant les Utilisateurs, Cohort s’engage à les informer dans un délai raisonnable préalablement à l’entrée en vigueur desdites modifications. Pendant cette période, l\'Utilisateur peut résilier son compte, à condition de respecter les engagements qu\'il a déjà pris.\\n\\n#### Accès à la Solution\\n\\nLa Solution est intégrée aux comptes des Utilisateurs auprès des Marques. Lors de sa connexion, l\'Utilisateur doit fournir toutes les informations requises par Cohort et par la Marque. Toute inscription incomplète ne sera pas validée. Cohort se réserve le droit de vérifier les informations fournies et de refuser toute demande invalide et/ou incomplète. L\'Utilisateur ne pourra prétendre à aucune indemnité à ce titre.\\n\\nEn interagissant avec la Solution, les Utilisateurs garantissent être des personnes physiques ayant la qualité de consommateur au sens de l\'article liminaire du code de la consommation et ayant la pleine capacité juridique de s\'engager au titre des présentes CGU.\\n\\nPar ailleurs, l’accès à la Solution est conditionné par la conformité aux politiques applicables des Marques. Cohort ne saurait être tenu responsable d’un refus d’inscription ou de vente lié à un manquement aux politiques des Marques.\\n\\n#### Engagements de Cohort\\n\\n##### Garanties liées à l’opération de la Solution\\n\\nCohort fournit ses meilleurs efforts pour fournir la Solution et en assurer l\'accessibilité et le bon fonctionnement.\\n\\nÀ cet effet, Cohort s\'engage à faire en sorte que la Solution soit accessible 24 heures sur 24, 7 jours sur 7, sauf en cas de force majeure ou de comportement imprévisible et inévitable d\'un tiers et sous réserve des éventuelles pannes, interventions de maintenance et mises à jour nécessaires au bon fonctionnement de la Solution.\\n\\nEn raison des caractéristiques propres à internet et aux réseaux de télécommunications, Cohort ne peut être tenu qu’à une obligation de moyens.\\n\\nEn particulier, sauf disposition légale ou réglementaire contraire, Cohort ne peut être tenu pour responsable en cas de :\\n\\n* pannes, dysfonctionnements ou cyberattaques ne relevant pas de sa responsabilité ;\\n\\n* tout dysfonctionnement ou difficulté technique ou informatique ne relevant pas de sa responsabilité, y compris liée à la Blockchain sous-jacente ;\\n\\n* perte de données des Utilisateurs non imputables à Cohort, notamment, mais pas exclusivement, en cas de piratage ou d\'hameçonnage du compte de l\'Utilisateur, en raison d\'une négligence dans la sécurisation de ses identifiants ;\\n\\n* l\'utilisation inhabituelle ou illégale de la Solution par un Utilisateur, une Marque ou tout autre tiers ;\\n\\n* tout cas de force majeure, au sens de l\'article 1218 du Code civil et de la jurisprudence associée.\\n\\n##### Absence de garanties liées aux Opérations et Avantages\\n\\nCohort ne fournit aucune garantie et ne se prononce pas sur la légitimité, l\'authenticité, le sérieux, le professionnalisme des Marques ou des Opérations qu\'elles mettent en œuvre.\\n\\nEn conséquence, Cohort ne saurait être responsable :\\n\\n* des contenus des Marques publiés sur la Solution qui contreviendraient aux dispositions législatives ou réglementaires applicables ou qui causerait un quelconque préjudice à un Utilisateur ou à un tiers, sauf à ce que Cohort soit notifié de ce contenu dans les conditions prévues à l\'article 8 ;\\n\\n* de la qualité ou de la conformité des Avantages offerts par les Marques via la Solution.\\n\\nLes risques spécifiques liés au service NFT sont décrits en Annexe 1.\\n\\n## 4. Accès à la Solution\\n\\nLa Solution est intégrée aux comptes des Utilisateurs auprès des Marques. Lors de sa connexion, l\'Utilisateur doit fournir toutes les informations requises par Cohort et par la Marque. Toute inscription incomplète ne sera pas validée. Cohort se réserve le droit de vérifier les informations fournies et de refuser toute demande invalide et/ou incomplète. L\'Utilisateur ne pourra prétendre à aucune indemnité à ce titre.\\n\\nEn interagissant avec la Solution, les Utilisateurs garantissent être des personnes physiques ayant la qualité de consommateur au sens de l\'article liminaire du code de la consommation et ayant la pleine capacité juridique de s\'engager au titre des présentes CGU.\\n\\nPar ailleurs, l’accès à la Solution est conditionné par la conformité aux politiques applicables des Marques. Cohort ne saurait être tenu responsable d’un refus d’inscription ou de vente lié à un manquement aux politiques des Marques.\\n\\n## 5. Engagements de Cohort\\n\\n#### Garanties liées à l’opération de la Solution\\n\\nCohort fournit ses meilleurs efforts pour fournir la Solution et en assurer l\'accessibilité et le bon fonctionnement.\\n\\nÀ cet effet, Cohort s\'engage à faire en sorte que la Solution soit accessible 24 heures sur 24, 7 jours sur 7, sauf en cas de force majeure ou de comportement imprévisible et inévitable d\'un tiers et sous réserve des éventuelles pannes, interventions de maintenance et mises à jour nécessaires au bon fonctionnement de la Solution.\\n\\nEn raison des caractéristiques propres à internet et aux réseaux de télécommunications, Cohort ne peut être tenu qu’à une obligation de moyens.\\n\\nEn particulier, sauf disposition légale ou réglementaire contraire, Cohort ne peut être tenu pour responsable en cas de :\\n\\n* pannes, dysfonctionnements ou cyberattaques ne relevant pas de sa responsabilité ;\\n\\n* tout dysfonctionnement ou difficulté technique ou informatique ne relevant pas de sa responsabilité, y compris liée à la Blockchain sous-jacente ;\\n\\n* perte de données des Utilisateurs non imputables à Cohort, notamment, mais pas exclusivement, en cas de piratage ou d\'hameçonnage du compte de l\'Utilisateur, en raison d\'une négligence dans la sécurisation de ses identifiants ;\\n\\n* l\'utilisation inhabituelle ou illégale de la Solution par un Utilisateur, une Marque ou tout autre tiers ;\\n\\n* tout cas de force majeure, au sens de l\'article 1218 du Code civil et de la jurisprudence associée.\\n\\n#### Absence de garanties liées aux Opérations et Avantages\\n\\nCohort ne fournit aucune garantie et ne se prononce pas sur la légitimité, l\'authenticité, le sérieux, le professionnalisme des Marques ou des Opérations qu\'elles mettent en œuvre.\\n\\nEn conséquence, Cohort ne saurait être responsable :\\n\\n* des contenus des Marques publiés sur la Solution qui contreviendraient aux dispositions législatives ou réglementaires applicables ou qui causerait un quelconque préjudice à un Utilisateur ou à un tiers, sauf à ce que Cohort soit notifié de ce contenu dans les conditions prévues à l\'article 8 ;\\n\\n* de la qualité ou de la conformité des Avantages offerts par les Marques via la Solution.\\n\\nLes risques spécifiques liés au service NFT sont décrits en Annexe 1.\\n\\n## 6. Engagement des Utilisateurs\\n\\n#### En contrepartie de l\'engagement de Cohort de fournir et d\'exploiter la Solution, les Utilisateurs doivent prendre les engagements suivants envers Cohort.\\n\\nEn interagissant avec la Solution, les Utilisateurs garantissent être âgés d\'au moins 18 ans ou avoir obtenu l\'autorisation d\'un parent ou d\'un tuteur légal.\\n\\nPar ailleurs, les Utilisateurs s\'engagent à :\\n\\n* fournir des informations véridiques, exactes et exemptes d\'erreurs lors de l\'interaction avec la Solution, maintenir ces informations à jour tout au long de leur utilisation et publier des contenus qui répondent à ces mêmes exigences ; la vérification de l\'identité de l\'Utilisateur est notamment exigé pour des raisons de KYC ainsi que dans le cadre de la lutte contre le blanchiment d\'argent (AML).\\n\\n* se conformer aux lois et règlements en vigueur dans le pays où ils se trouvent et s\'abstenir de troubler l\'ordre public et de violer toute disposition législative ou réglementaire ;\\n\\n* se conformer à toutes les politiques contractuelles des Marques ;\\n\\n* s\'abstenir de tout type d\'activité frauduleuse ;\\n\\n* utiliser la Solution conformément à sa finalité et à son objectif.\\n\\n#### Les Utilisateurs comprennent et acceptent que les comportements suivants sont strictement interdits :\\n\\n* tout comportement qui perturbe, suspend, ralentit ou empêche la continuité de la Solution ;\\n\\n* la publication de contenus illicites, notamment tout contenu ou information haineux, discriminant, insultant, violent, contraire à l’ordre public ou aux bonnes mœurs, portant atteinte à tout type de droits de propriété intellectuelle, ou tout autre type de contenu illicite ou immoral ;\\n\\n* toute intrusion ou tentative d\'intrusion dans les systèmes d\'information de Cohort ;\\n\\n* toute action entraînant une charge disproportionnée sur les infrastructures numériques de Cohort ;\\n\\n* toute violation des mesures de sécurité et d\'authentification ;\\n\\n* toute copie et/ou détournement de la Solution et/ou des infrastructures numériques de Cohort ;\\n\\n* plus généralement, toute pratique de détournement de la Solution, à des fins autres que celles pour lesquelles elle a été conçue.\\n\\nLes Utilisateurs garantissent Cohort et ses affiliés contre toute plainte, réclamation, action et/ou revendication subie du fait de la violation par l\'Utilisateur de l\'une quelconque des obligations qui lui incombent au titre des présentes CGU. Les Utilisateurs s\'engagent à indemniser Cohort de tout préjudice direct subi du fait d\'un tel manquement.\\n\\n## 7. Notifications\\n\\nToute réclamation relative à l\'utilisation de la Solution, y compris toute connaissance d\'un contenu illicite, doit être adressée par courrier électronique à l\'adresse suivante : <contact@cohort.xyz>.\\n\\nAfin de permettre à Cohort de les traiter efficacement, toutes les notifications des Utilisateurs doivent inclure les informations suivantes :\\n\\n* nom, prénom ;\\n\\n* adresse mail ;\\n\\n* raisons de la plainte ;\\n\\n* localisation du contenu illicite ;\\n\\n* tout autre élément utile pour le traitement de la notification.\\n\\nDès réception de la notification, Cohort s\'informe des raisons et du contenu notifié dans les meilleurs délais.\\n\\nLe cas échéant, Cohort pourra demander à l\'Utilisateur tous documents et informations susceptibles de faciliter la résolution de la réclamation, qui devront être envoyés à l\'adresse électronique dédiée. Si l\'Utilisateur ne répond pas aux demandes de Cohort, ce dernier se réserve le droit de décider de l\'issue de la réclamation.\\n\\nLes Utilisateurs comprennent que, lorsque Cohort supprime l\'accès à un contenu en réponse à une notification, Cohort informera la Marque ou l’Utilisateur qui a notifié le contenu et la personne qui a posté le contenu de la décision de suppression. Cohort peut fournir des informations relatives à la demande de la partie notifiante à la personne qui a posté le contenu.\\n\\nEn outre, les Utilisateurs sont informés que Cohort conservera le contenu des notifications pendant une période de cinq (5) ans à compter de la date de résolution de la réclamation ou de la résiliation des CGU pour des raisons juridiques.\\n\\n## 8. Durée, suspension et résiliation\\n\\n#### Durée des CGU\\n\\nLes CGU sont conclues pour une durée indéterminée. Elles restent en vigueur aussi longtemps que l\'Utilisateur accède à la Solution.\\n\\n#### Suspension\\n\\nSi un Utilisateur ne respecte pas l\'un de ses engagements en vertu des CGU, Cohort peut, temporairement et sans préavis, suspendre l\'accès à la Solution.\\n\\nAprès une période d\'enquête, au cours de laquelle Cohort vérifiera, le cas échéant, la véracité des violations alléguées, l\'accès à la Solution pourra être rétabli, ou les CGU pourront être résiliées selon les modalités ci-dessous.\\n\\n#### Résiliation\\n\\nLes Utilisateurs peuvent supprimer leur compte à tout moment sur la Solution. Après cette résiliation, l\'Utilisateur ne pourra plus accéder à la Solution, à moins d\'accepter à nouveau les CGU.\\n\\nDans le cas d\'un changement de la réglementation applicable et de l\'interprétation qui en est faite par l\'autorité réglementaire compétente, affectant la capacité de Cohort ou de ses employés à exploiter la Solution, les CGU seront automatiquement résiliées.\\n\\nSans préjudice de toute autre action, Cohort peut résilier ces CGU et bloquer l\'accès de l\'Utilisateur à la Solution en cas de violation matérielle de ces CGU et en particulier les engagements contenus à l’article 6.\\n\\nLa résiliation des CGU n\'entraînera en aucun cas une compensation de Cohort à un Utilisateur.\\n\\n## 9. Hyperliens\\n\\nLa Solution peut contenir des liens ou du contenu redirigeant vers des sites web ou des ressources de tiers, qui peuvent être soumis à des politiques différentes.\\n\\nCohort n\'est pas responsable du contenu disponible à travers ces liens. La présence de tels liens ne constitue pas une approbation des services tiers par Cohort.\\n\\n## 10. Propriété intellectuelle\\n\\nLa Solution et toutes ses fonctionnalités et plus largement tout contenu généré par Cohort sont la seule propriété intellectuelle de Cohort ou de la Marque et sont protégées par tous les droits de propriété intellectuelle en vigueur.\\n\\nSous réserve du respect par l\'Utilisateur des présentes CGU et de toute autre condition applicable, Cohort lui accorde par la présente une licence strictement personnelle et individuelle, pour le monde entier, limitée, non exclusive, non transférable, non sous-licenciable et révocable, d\'accès et d\'utilisation de la Solution. Cette licence est accordée pour toute la durée de l\'utilisation conforme de la Solution par l\'utilisateur et sera automatiquement résiliée avec les CGU.\\n\\nLes Utilisateurs comprennent que cette licence n\'accorde pas plus de droits que ceux exprimés dans les présentes et, en particulier, ne permet pas la reproduction ou la représentation sous quelque forme que ce soit de tout ou partie de la Solution et des contenus afférents à l’Opération édités par la Marque. Dans le cas particulier des NFT, les droits d\'auteur sur les objets numériques associés restent la propriété seule et entière de la Marque. La détention d\'un NFT ne confère pas la propriété des droits d’auteur sur l\'œuvre sous-jacente.\\n\\nLes Utilisateurs sont informés que Cohort est le producteur de la base de données constituée par l\'ensemble des données générées par la Solution. Toute extraction ou réutilisation de cette base de données sans l\'accord écrit préalable de Cohort est strictement interdite. La licence conférée sur la Solution n’accorde aucun droit, de quelque nature que ce soit, sur cette base de données.\\n\\n## 11. Données personnelles\\n\\nL\'utilisation de la Solution implique une collecte et un traitement des données personnelles des Utilisateurs par la Marque en sa qualité de Responsable de traitement. A ce titre, la Marque s’engage à ce que le traitement des données personnelles, effectué à partir de la Solution, soit conforme au Règlement Général sur la Protection des Données (RGPD) et à la loi Informatique et Libertés.\\n\\n## 12. Nullité\\n\\nSi l\'une quelconque des dispositions des présentes CGU est invalidée par une modification de la législation, de la réglementation ou par une décision de justice, les autres dispositions ne seront pas affectées.\\n\\n## 13. Cession\\n\\nLes Utilisateurs ne peuvent pas céder ou transférer les CGU à une tierce partie sans le consentement écrit préalable de Cohort.\\n\\nEn cas de (i) fusion par constitution d\'une nouvelle société, d\'apport partiel d\'actif, de fusion par absorption, de scission d\'actifs, ou de toute autre opération entraînant une transmission universelle du patrimoine de Cohort ou (ii) de toute opération entraînant un changement de contrôle direct ou indirect affectant Cohort, les CGU perdureront sans qu\'il soit nécessaire d\'en informer ou d\'obtenir l\'accord des Utilisateurs.\\n\\n## 14. Litiges et médiation\\n\\n#### Litige\\n\\nTout litige relatif à l\'utilisation de la Solution et des Services doit être soumis à Cohort en envoyant un courrier électronique à <support@cohort.xyz>.\\n\\n#### Service de médiation de la Commission européenne\\n\\nConformément à l\'article L.616-2 du Code de la consommation, les Utilisateurs peuvent recourir au service de médiation de la Commission européenne qui a pour objet de recueillir les réclamations des consommateurs de l\'Union européenne et de transmettre leur dossier à des médiateurs nationaux. Ce service est accessible par le lien suivant : ec.europa.eu/consumers.\\n\\n## 15. Droit applicable et juridiction compétente\\n\\nLes CGU sont régies et interprétées conformément au droit français, et relèvent de la compétence des tribunaux français.\\n\\nSauf disposition légale contraire, tout conflit ou litige relatif à la validité, l\'interprétation, l\'exécution et/ou la résiliation des CGU sera soumis aux tribunaux compétents.\\n\\n## 16. Annexe I\\n\\nAvertissement sur les risques liés à l’achat de NFT\\n\\nEn achetant des NFT aux Marques par l\'intermédiaire de la Solution, les Utilisateurs garantissent qu\'ils ont lu et compris les risques suivants.\\n\\n#### Risque technologique\\n\\nLes Utilisateurs doivent être conscients des risques techniques liés aux NFTs, y compris les risques découlant d\'une erreur ou d\'un défaut de sécurité associé à la Blockchain, qui peut entraîner une perte de données ou une perte d\'accès aux NFT.\\n\\nCela peut résulter d\'une erreur ou d\'une défaillance de sécurité associée à la Blockchain et au smart contract, permettant et/ou entraînant le piratage et le vol de données sur la Solution, y compris, mais sans s\'y limiter, les attaques Sybil. Dans le cas où cette erreur ou défaillance relève de la plateforme Cohort, Cohort fera son possible pour corriger l’erreur ou la défaillance dans les meilleurs délais.\\n\\n#### Risque économique\\n\\nLes Utilisateurs sont conscients que les NFT sont des actifs dont la valeur n\'est pas intrinsèquement garantie et dépend de marchés non réglementés. En achetant les NFT aux Marques, les Utilisateurs sont exposés à des risques élevés de perte de valeur.\\n\\n#### Risque légal\\n\\nLes Utilisateurs comprennent que le cadre juridique des NFT varie en fonction de la juridiction dans laquelle ils se trouvent et que les NFT peuvent être interdits ou soumis à un cadre réglementaire susceptible d\'en diminuer la valeur de manière significative ou totale.\\n\\nAinsi, Cohort n\'émet aucune garantie s\'agissant des droits de propriété intellectuelle attachés aux NFT ou sur la qualification juridique des NFT.","id":"ch/fr","code":"fr-ch","iso":"fr_CH"},"ch/it":{"copy":"it","language":"it","region":"ch","name":"Svizzera (IT)","terms_url":"https://www.lacoste.com/ch/it/co-creative-challenge-terms-and-conditions-fw26.html","gdpr":"Lacoste S.A.S., in qualità di titolare del trattamento, tratta i vostri dati personali (cognome, nome, data di nascita, indirizzo e-mail, numero di telefono, sesso (facoltativo) e Paese di residenza) per gestire l’organizzazione del concorso accessibile [su dispositivi mobili e tablet]. La partecipazione richiede la compilazione del modulo di registrazione e il vostro consenso.I dati raccolti saranno utilizzati esclusivamente per il corretto svolgimento del concorso e saranno cancellati al termine dello stesso, salvo obblighi di legge o necessità di conservazione per la gestione di eventuali reclami.I vostri dati potranno essere trasmessi, in misura strettamente limitata, alle società affiliate e ai fornitori di servizi di Lacoste coinvolti nell’organizzazione del concorso.Conformemente alla legislazione svizzera e, ove applicabile, al Regolamento generale sulla protezione dei dati (RGPD), disponete dei diritti di accesso, rettifica, cancellazione, limitazione del trattamento, opposizione e portabilità dei dati, nonché del diritto di impartire istruzioni sul destino dei vostri dati dopo il decesso. Potete esercitare tali diritti tramite il modulo di contatto (sul sito di vendita online di Lacoste), selezionando «Dati personali». Avete inoltre il diritto di presentare un reclamo <strong>all’Incaricato federale della protezione dei dati e della trasparenza (IFPDT)</strong>. Per ulteriori informazioni, consultate la nostra Informativa <a target=\\"_blank\\" rel=\\"noreferrer noopener nofollow\\" href=\\"https://www.lacoste.com/ch/it/privacy.html\\">sulla privacy</a>.","optin_legal":"Acconsento a partecipare al concorso e, di conseguenza, ne accetto il regolamento.","optin_member":"Acconsento a iscrivermi al programma fedeltà Lacoste se non ne sono già membro. Selezionando questa casella, acconsento all’utilizzo dei dati personali da me forniti per ricevere le mie offerte, i vantaggi esclusivi riservati ai membri e informazioni sulle novità del marchio.","privacy_link":"https://www.lacoste.com/ch/it/privacy.html","legals_content":"## 1. Definitions\\n\\nWithout prejudice to other definitions in these Terms and Conditions of Use («Terms»), the terms defined below shall have the meanings assigned to them whenever capitalized, in singular or plural form.\\n\\n**Benefits:** Refers to the digital or physical utilities offered or sold by the Brand to Users as part of the Operations and which may be associated with an NFT.\\n\\n**T\\\\&Cs:** Refers to the General Terms and Conditions of Use of the platform.\\n\\n**Cohort:** Refers to Cohort, the company identified in the legal notices.\\n\\n**Account:** Refers to the account created by the User during their registration on the platform.\\n\\n**Brands:** Refers to professional legal entities conducting Operations through the Solution.\\n\\n**NFT:** Refers to non-fungible tokens compliant with ERC-721 and ERC-1115 standards or other similar standards and stored on a Blockchain.\\n\\n**Operations:** Refers to the promotional campaigns conducted by Brands using the Solution.\\n\\n**Outage:** Refers to a technical issue preventing proper access to or use of the platform.\\n\\n**Smart Contract:** Refers to the intelligent contract in the form of computer code that facilitates transactions on the blockchain.\\n\\n**Solution:** Refers to the technological solution developed by Cohort, enabling Brands to create and track Operations.\\n\\n**Users:** Refers to the clients of the Brands who participate in the Operations via the Solution.\\n\\n## 2. Purpose and Scope\\n\\nThese Terms aim to define the conditions for secure access and use of the Solution by Users.\\n\\nCohort acts as a technical intermediary between Brands and Users, with its role limited to managing the Solution. Consequently, Cohort is never a party to transactions carried out by the Brands. Similarly, Advantages and NFTs are issued and sold by Brands to Users and never by Cohort.\\n\\nTherefore, these Terms do not govern any relationship of any kind between Brands and Users.\\n\\n## 3. Acceptance and Modifications\\n\\n#### Acceptance\\n\\nThe Terms are accessible at any time on the Solution and apply to all interactions with the Solution. They shall prevail over any other version or contradictory document.\\n\\nUsers agree to read, fully accept, and comply with these Terms by ticking the corresponding box.\\n\\n#### Modifications to the Terms\\n\\nTo enhance the Solution\'s features and quality, Cohort may add, remove, or replace functionalities at any time.\\n\\nCohort may modify the Terms as needed and will make its best effort to inform Users of changes before they take effect.\\n\\nIn case of substantial modifications (including the removal of a feature) affecting Users, Cohort commits to notifying them within a reasonable timeframe before the changes take effect. During this period, Users may terminate their account, provided they fulfill existing commitments.\\n\\n## 4. Access to the Solution\\n\\nThe Solution is integrated into Users’ accounts with the Brands. Upon login, Users must provide all required information to both Cohort and the Brand. Incomplete registrations will not be validated. Cohort reserves the right to verify provided information and reject invalid and/or incomplete requests, with no entitlement to compensation.\\n\\nBy interacting with the Solution, Users guarantee they are individuals acting as consumers under applicable laws and have full legal capacity to agree to these Terms.\\n\\nAccess to the Solution is also subject to compliance with applicable Brand policies. Cohort is not responsible for registration or sales refusals due to breaches of Brand policies.\\n\\n## 5. Cohort’s Commitments\\n\\n#### Guarantees Related to the Solution’s Operation\\n\\nCohort will make its best efforts to provide the Solution and ensure its accessibility and proper functioning.\\n\\nThe Solution is intended to be available 24/7, except in cases of force majeure, unforeseen third-party actions, or necessary maintenance, updates, or system failures.\\n\\nGiven the nature of the internet and telecommunications networks, Cohort has an obligation of means, not results.\\n\\nCohort is not liable for:\\n\\n* Failures, malfunctions, or cyberattacks beyond its control.\\n\\n* Technical or IT issues unrelated to its operations, including those involving the underlying Blockchain.\\n\\n* Loss of User data not attributable to Cohort, such as phishing or hacking due to User negligence.\\n\\n* Unauthorized or illegal use of the Solution by Users, Brands, or third parties.\\n\\n* Force majeure events as defined by French law (Article 1218 of the Civil Code).\\n\\n#### No Guarantees Related to Transactions and Advantages\\n\\nCohort does not guarantee or assess the legitimacy, authenticity, seriousness, or professionalism of Brands or their operations.\\n\\nCohort cannot be held liable for:\\n\\n* Content posted by Brands on the Solution that violates laws or regulations, or causes harm to a User or third party unless Cohort is notified as described in Section 8.\\n\\n* The quality or compliance of Advantages offered by Brands via the Solution.\\n\\n* Risks related to NFT services are detailed in Annex I.\\n\\n## 6. User Commitments\\n\\n#### User Commitments\\n\\nIn return for Cohort\'s provision of the Solution, Users agree to:\\n\\n* Be at least 18 years old or have parental or legal guardian permission.\\n\\n* Provide accurate, truthful, and error-free information during interactions with the Solution and keep such information up-to-date. Identity verification (e.g., KYC) may be required for compliance with anti-money laundering (AML) laws.\\n\\n* Comply with applicable laws and regulations, maintain public order, and adhere to Brand policies.\\n\\n* Avoid fraudulent activities.\\n\\n* Use the Solution in accordance with its intended purpose.\\n\\n#### Prohibited Behaviors\\n\\nUsers must not:\\n\\n* Disrupt, suspend, slow down, or hinder the Solution’s functionality.\\n\\n* Publish illegal content, including hate speech, discrimination, violence, or content violating intellectual property or public decency.\\n\\n* Intrude or attempt to intrude on Cohort’s IT systems.\\n\\n* Overburden Cohort’s infrastructure.\\n\\n* Violate security measures.\\n\\n* Copy, misappropriate, or misuse the Solution or its digital infrastructure.\\n\\nUsers indemnify Cohort against complaints, claims, or legal actions arising from their violations of the Terms.\\n\\n## 7. Notifications\\n\\nClaims regarding Solution use, including notifications of illegal content, must be submitted to <contact@cohort.xyz> and include:\\n\\n* Full name and email address.\\n\\n* Complaint details and location of the content.\\n\\nCohort will review such complaints promptly and may request additional documents to resolve the issue. Failure to respond may result in unilateral resolution by Cohort.\\n\\n## 8. Duration, Suspension, and Termination\\n\\n#### Duration\\n\\nThe Terms remain effective as long as Users access the Solution.\\n\\n#### Suspension and Termination\\n\\nNon-compliance with the Terms may result in temporary suspension or termination after investigation.\\n\\nUsers may delete their accounts at any time, ending their access to the Solution. Regulatory changes affecting Cohort\'s operations may also result in automatic termination.\\n\\nCohort is not liable for compensation upon termination of the Terms.\\n\\n## 9. Intellectual Property\\n\\nThe Solution and all its features are the intellectual property of Cohort or Brands. A non-exclusive, non-transferable, and revocable license is granted to Users for personal use. Ownership of NFT copyrights remains with Brands.\\n\\n## 10. Personal Data\\n\\nThe use of the Solution entails the collection and processing of personal data by the Brand in compliance with GDPR and French data protection laws.\\n\\n## 11. Disputes and Mediation\\n\\n#### Disputes\\n\\nDisputes must be submitted via <support@cohort.xyz>. EU consumers may also use the European Commission’s mediation service at ec.europa.eu/consumers.\\n\\n#### Governing Law\\n\\nFrench law governs the Terms, with French courts holding jurisdiction.","id":"ch/it","code":"it","iso":"it_CH"},"ch/de":{"copy":"de","language":"de","region":"ch","name":"Schweiz (DE)","terms_url":"https://www.lacoste.com/ch/de/co-creative-challenge-terms-and-conditions-fw26.html","gdpr":"Lacoste S.A.S. verarbeitet als Verantwortlicher Ihre personenbezogenen Daten (Nachname, Vorname, Geburtsdatum, E-Mail-Adresse, Telefonnummer, Geschlecht (optional) und Wohnsitzland), um das Gewinnspiel zu organisieren, das [über Mobilgeräte und Tablets] zugänglich ist. Ihre Teilnahme setzt das Ausfüllen des Registrierungsformulars und Ihre Einwilligung voraus.Die erhobenen Daten werden ausschliesslich zur ordnungsgemässen Durchführung des Gewinnspiels verwendet und nach dessen Ende gelöscht, sofern keine gesetzlichen Pflichten oder die Bearbeitung möglicher Beschwerden eine längere Aufbewahrung erfordern. Ihre Daten können in streng begrenztem Umfang an verbundene Unternehmen und Dienstleister von Lacoste weitergegeben werden, die an der Organisation des Gewinnspiels beteiligt sind. Gemäss der schweizerischen Gesetzgebung und, soweit anwendbar, der Datenschutz-Grundverordnung (DSGVO) haben Sie das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Widerspruch und Datenübertragbarkeit sowie das Recht, Anweisungen zum Umgang mit Ihren Daten nach Ihrem Tod festzulegen. Sie können diese Rechte über das Kontaktformular (auf der Website des Lacoste-Onlineshops) ausüben, indem Sie «Personenbezogene Daten» auswählen. Sie haben ausserdem das Recht, beim Eidgenössischen Datenschutz- und Öffentlichkeitsbeauftragten (EDÖB) eine Beschwerde einzureichen. Weitere Informationen finden Sie in unserer <a target=\\"_blank\\" rel=\\"noreferrer noopener nofollow\\" href=\\"https://www.lacoste.com/ch/de/privacy.html\\">Datenschutzrichtlinie</a>.","optin_legal":"IIch stimme der Teilnahme am Gewinnspiel zu und akzeptiere damit die Teilnahmebedingungen des Gewinnspiels.","optin_member":"Ich stimme der Anmeldung zum Lacoste-Treueprogramm zu, sofern ich noch kein Mitglied bin. Durch Ankreuzen dieses Kästchens willige ich ein, dass meine übermittelten personenbezogenen Daten verwendet werden, damit ich meine Angebote und exklusiven Mitgliedervorteile erhalte und über Neuigkeiten der Marke informiert werde.","privacy_link":"https://www.lacoste.com/ch/it/privacy.html","legals_content":"## 1. Begriffsbestimmungen\\n\\nUnvoreingenommen hinsichtlich anderer Definitionen in diesen Nutzungsbedingungen („Bedingungen“) haben die nachstehend definierten Begriffe die ihnen zugewiesene Bedeutung, in Einzahl oder Mehrzahl.\\n\\n**Leistungen:** Bezieht sich auf die digitalen oder physischen Hilf niemals aber von dem Unternehmen.\\n\\nDaher regeln die vorliegenden Bedingungen keinerlei Beziehung zwischen den Brands und den Nutzern.\\n\\n## 3. Annahme und Änderungen\\n\\n#### Annahme\\n\\nDie Bedingungen sind jederzeit über die Lösung zugänglich und gelten für alle Interaktionen mit der Lösung. Sie haben Vorrang vor allen anderen Versionen oder widersprüchlichen Dokumenten.\\n\\nDie Nutzer stimmen zu, diese Bedingungen zu lesen, vollständig zu akzeptieren und einzuhalten, indem sie das entsprechende Kästchen ankreuzen.\\n\\n#### Änderungen der Bedingungen\\n\\nUm die Funktionen und die Qualität der Lösung zu verbessern, kann das Unternehmen jederzeit Funktionalitäten hinzufügen, entfernen oder ersetzen.\\n\\nDas Unternehmen kann die Bedingungen nach Bedarf ändern und wird sich nach besten Kräften bemühen, die Nutzer über Änderungen zu informieren, bevor diese in Kraft treten.\\n\\nIm Falle wesentlicher Änderungen (einschließlich der Entfernung einer Funktion), die den Benutzer betreffen, verpflichtet sich das Unternehmen, ihn innerhalb eines angemessenen Zeitraums vor Inkrafttreten der Änderungen zu informieren. Während dieses Zeitraums können die Nutzer ihr Konto kündigen, sofern sie die bestehenden Verpflichtungen erfüllen.\\n\\n## 4. Zugang zu der Lösung\\n\\nDie Lösung ist in die Konten der Nutzer bei den Marken integriert. Bei der Anmeldung müssen die Nutzer alle erforderlichen Informationen sowohl an das Unternehmen als auch an die Brands übermitteln. Unvollständige Registrierungen werden nicht validiert. Das Unternehmen behält sich das Recht vor, die zur Verfügung gestellten Informationen zu überprüfen und ungültige und/oder unvollständige Anfragen abzulehnen, ohne dass ein Anspruch auf Entschädigung besteht.\\n\\nDurch die Interaktion mit der Lösung garantieren die Nutzer, dass sie nach geltendem Recht als Verbraucher handeln und voll geschäftsfähig sind, um diesen Bedingungen zuzustimmen.\\n\\nDer Zugang zu der Lösung unterliegt auch der Einhaltung der geltenden Markenrichtlinien. Das Unternehmen ist nicht verantwortlich für die Verweigerung von Registrierungen oder Verkäufen aufgrund von Verstößen gegen die Markenrichtlinien.\\n\\n## 5. Die Verpflichtungen der Kohorte\\n\\n#### Garantien in Bezug auf den Betrieb der Lösung\\n\\nDas Unternehmen wird sich nach besten Kräften bemühen, die Lösung zur Verfügung zu stellen und ihre Zugänglichkeit und ordnungsgemäße Funktion zu gewährleisten.\\n\\nDie Lösung soll rund um die Uhr verfügbar sein, außer in Fällen höherer Gewalt, unvorhergesehener Handlungen Dritter oder notwendiger Wartung, Updates oder Systemausfällen.\\n\\nIn Anbetracht der Natur des Internets und der Telekommunikationsnetze hat das Unternehmen eine Verpflichtung der Mittel, nicht der Ergebnisse.\\n\\nDas Unternehmen ist nicht haftbar für:\\n\\n* Ausfälle, Fehlfunktionen oder Cyberangriffe, die sich seiner Kontrolle entziehen.\\n\\n* Technische oder IT-Probleme, die nicht mit dem Betrieb von dem Unternehmen zusammenhängen, einschließlich solcher, die die zugrunde liegende Blockchain betreffen.\\n\\n* Verlust von Nutzerdaten, der nicht dem Unternehmen zuzuschreiben ist, wie z. B. Phishing oder Hacking aufgrund von Fahrlässigkeit des Nutzers.\\n\\n* Unbefugte oder illegale Nutzung der Lösung durch Nutzer, Marken oder Dritte.\\n\\n* Ereignisse höherer Gewalt im Sinne des französischen Rechts (Artikel 1218 des Zivilgesetzbuchs).\\n\\n#### Keine Garantien in Bezug auf Transaktionen und Vorteile\\n\\nDas Unternehmen garantiert oder bewertet nicht die Legitimität, Authentizität, Seriosität oder Professionalität der Marken oder ihrer Tätigkeiten.\\n\\nDas Unternehmen kann nicht haftbar gemacht werden für:\\n\\n* Von Marken in der Lösung veröffentlichte Inhalte, die gegen Gesetze oder Vorschriften verstoßen oder einem Nutzer oder Dritten Schaden zufügen, es sei denn, das Unternehmen wird wie in Abschnitt 8 beschrieben benachrichtigt.\\n\\n* Die Qualität oder Konformität der von den Marken über die Lösung angebotenen Vorteile.\\n\\n* Die Risiken im Zusammenhang mit NFT-Diensten sind in Anhang I aufgeführt.\\n\\n## 6. Benutzerverpflichtungen\\n\\n#### Benutzerverpflichtungen\\n\\nAls Gegenleistung für die Bereitstellung der Lösung durch das Unternehmen stimmen die Benutzer zu:\\n\\n* Sie müssen mindestens 18 Jahre alt sein oder die Erlaubnis der Eltern oder des gesetzlichen Vertreters haben.\\n\\n* Bei der Interaktion mit der Lösung genaue, wahrheitsgemäße und fehlerfreie Angaben machen und diese Informationen auf dem neuesten Stand halten. Eine Identitätsüberprüfung (z. B. KYC) kann zur Einhaltung der Gesetze zur Bekämpfung der Geldwäsche (AML) erforderlich sein.\\n\\n* Halten Sie die geltenden Gesetze und Vorschriften ein, wahren Sie die öffentliche Ordnung und befolgen Sie die Richtlinien der Marke.\\n\\n* Vermeiden Sie betrügerische Aktivitäten.\\n\\n* Die Lösung entsprechend ihrem Zweck zu nutzen.\\n\\n#### Verbotenes Verhalten\\n\\nNutzer dürfen nicht:\\n\\n* die Funktionalität der Lösung unterbrechen, aussetzen, verlangsamen oder behindern.\\n\\n* Illegale Inhalte veröffentlichen, einschließlich Hassreden, Diskriminierung, Gewalt oder Inhalte, die gegen geistiges Eigentum oder die guten Sitten verstoßen.\\n\\n* In die IT-Systeme von dem Unternehmen eindringen oder versuchen, in diese einzudringen.\\n\\n* Die Infrastruktur von dem Unternehmen überlasten.\\n\\n* Sicherheitsmaßnahmen verletzen.\\n\\n* Die Lösung oder ihre digitale Infrastruktur kopieren, sich aneignen oder missbrauchen.\\n\\nDie Nutzer stellen das Unternehmen von Beschwerden, Ansprüchen oder Klagen frei, die sich aus Verstößen gegen die Nutzungsbedingungen ergeben.\\n\\n## 7. Benachrichtigung\\n\\nBeschwerden über die Verwendung der Lösung, einschließlich Meldungen über illegale Inhalte, müssen an <contact@cohort.xyz> gerichtet werden und folgende Angaben enthalten:\\n\\n* Vollständiger Name und E-Mail-Adresse.\\n\\n* Einzelheiten der Beschwerde und Ort des Inhalts.\\n\\nDas Unternehmen wird solche Bes rs to the clients of the Brands who participate in the Operations via the Solution.\\n\\n## 2. Purpose and Scope\\n\\nThese Terms aim to define the conditions for secure access and use of the Solution by Users.\\n\\nCohort acts as a technical intermediary between Brands and Users, with its role limited to managing the Solution. Consequently, Cohort is never a party to transactions carried out by the Brands. Similarly, Advantages and NFTs are issued and sold by Brands to Users and never by Cohort.\\n\\nTherefore, these Terms do not govern any relationship of any kind between Brands and Users.\\n\\n## 3. Acceptance and Modifications\\n\\n#### Acceptance\\n\\nThe Terms are accessible at any time on the Solution and apply to all interactions with the Solution. They shall prevail over any other version or contradictory document.\\n\\nUsers agree to read, fully accept, and comply with these Terms by ticking the corresponding box.\\n\\n#### Modifications to the Terms\\n\\nTo enhance the Solution\'s features and quality, Cohort may add, remove, or replace functionalities at any time.\\n\\nCohort may modify the Terms as needed and will make its best effort to inform Users of changes before they take effect.\\n\\nIn case of substantial modifications (including the removal of a feature) affecting Users, Cohort commits to notifying them within a reasonable timeframe before the changes take effect. During this period, Users may terminate their account, provided they fulfill existing commitments.\\n\\n## 4. Access to the Solution\\n\\nThe Solution is integrated into Users’ accounts with the Brands. Upon login, Users must provide all required information to both Cohort and the Brand. Incomplete registrations will not be validated. Cohort reserves the right to verify provided information and reject invalid and/or incomplete requests, with no entitlement to compensation.\\n\\nBy interacting with the Solution, Users guarantee they are individuals acting as consumers under applicable laws and have full legal capacity to agree to these Terms.\\n\\nAccess to the Solution is also subject to compliance with applicable Brand policies. Cohort is not responsible for registration or sales refusals due to breaches of Brand policies.\\n\\n## 5. Cohort’s Commitments\\n\\n#### Guarantees Related to the Solution’s Operation\\n\\nCohort will make its best efforts to provide the Solution and ensure its accessibility and proper functioning.\\n\\nThe Solution is intended to be available 24/7, except in cases of force majeure, unforeseen third-party actions, or necessary maintenance, updates, or system failures.\\n\\nGiven the nature of the internet and telecommunications networks, Cohort has an obligation of means, not results.\\n\\nCohort is not liable for:\\n\\n* Failures, malfunctions, or cyberattacks beyond its control.\\n\\n* Technical or IT issues unrelated to its operations, including those involving the underlying Blockchain.\\n\\n* Loss of User data not attributable to Cohort, such as phishing or hacking due to User negligence.\\n\\n* Unauthorized or illegal use of the Solution by Users, Brands, or third parties.\\n\\n* Force majeure events as defined by French law (Article 1218 of the Civil Code).\\n\\n#### No Guarantees Related to Transactions and Advantages\\n\\nCohort does not guarantee or assess the legitimacy, authenticity, seriousness, or professionalism of Brands or their operations.\\n\\nCohort cannot be held liable for:\\n\\n* Content posted by Brands on the Solution that violates laws or regulations, or causes harm to a User or third party unless Cohort is notified as described in Section 8.\\n\\n* The quality or compliance of Advantages offered by Brands via the Solution.\\n\\n* Risks related to NFT services are detailed in Annex I.\\n\\n## 6. User Commitments\\n\\n#### User Commitments\\n\\nIn return for Cohort\'s provision of the Solution, Users agree to:\\n\\n* Be at least 18 years old or have parental or legal guardian permission.\\n\\n* Provide accurate, truthful, and error-free information during interactions with the Solution and keep such information up-to-date. Identity verification (e.g., KYC) may be required for compliance with anti-money laundering (AML) laws.\\n\\n* Comply with applicable laws and regulations, maintain public order, and adhere to Brand policies.\\n\\n* Avoid fraudulent activities.\\n\\n* Use the Solution in accordance with its intended purpose.\\n\\n#### Prohibited Behaviors\\n\\nUsers must not:\\n\\n* Disrupt, suspend, slow down, or hinder the Solution’s functionality.\\n\\n* Publish illegal content, including hate speech, discrimination, violence, or content violating intellectual property or public decency.\\n\\n* Intrude or attempt to intrude on Cohort’s IT systems.\\n\\n* Overburden Cohort’s infrastructure.\\n\\n* Violate security measures.\\n\\n* Copy, misappropriate, or misuse the Solution or its digital infrastructure.\\n\\nUsers indemnify Cohort against complaints, claims, or legal actions arising from their violations of the Terms.\\n\\n## 7. Notifications\\n\\nClaims regarding Solution use, including notifications of illegal content, must be submitted to <contact@cohort.xyz> and include:\\n\\n* Full name and email address.\\n\\n* Complaint details and location of the content.\\n\\nCohort will review such complaints promptly and may request additional documents to resolve the issue. Failure to respond may result in unilateral resolution by Cohort.\\n\\n## 8. Duration, Suspension, and Termination\\n\\n#### Duration\\n\\nThe Terms remain effective as long as Users access the Solution.\\n\\n#### Suspension and Termination\\n\\nNon-compliance with the Terms may result in temporary suspension or termination after investigation.\\n\\nUsers may delete their accounts at any time, ending their access to the Solution. Regulatory changes affecting Cohort\'s operations may also result in automatic termination.\\n\\nCohort is not liable for compensation upon termination of the Terms.\\n\\n## 9. Intellectual Property\\n\\nThe Solution and all its features are the intellectual property of Cohort or Brands. A non-exclusive, non-transferable, and revocable license is granted to Users for personal use. Ownership of NFT copyrights remains with Brands.\\n\\n## 10. Personal Data\\n\\nThe use of the Solution entails the collection and processing of personal data by the Brand in compliance with GDPR and French data protection laws.\\n\\n## 11. Disputes and Mediation\\n\\n#### Disputes\\n\\nDisputes must be submitted via <support@cohort.xyz>. EU consumers may also use the European Commission’s mediation service at ec.europa.eu/consumers.\\n\\n#### Governing Law\\n\\nFrench law governs the Terms, with French courts holding jurisdiction.","id":"nl/nl","code":"nl-nl","iso":"nl_NL"},"at/de":{"copy":"de","language":"de","region":"at","name":"Österreich (DE)","terms_url":"https://www.lacoste.com/at/co-creative-challenge-terms-and-conditions-fw26.html","gdpr":"Lacoste S.A.S. verarbeitet als Verantwortlicher Ihre personenbezogenen Daten (Nachname, Vorname, Geburtsdatum, E-Mail-Adresse, Telefonnummer, Geschlecht (optional) und Wohnsitzland) zum Zweck der Organisation des Gewinnspiels, das über Mobilgeräte und Tablets zugänglich ist. Ihre Teilnahme setzt das vollständige Ausfüllen des Registrierungsformulars und Ihre Einwilligung voraus.Die erhobenen Daten werden ausschließlich zur ordnungsgemäßen Durchführung des Gewinnspiels verwendet und nach dessen Ende gelöscht, sofern keine gesetzlichen Verpflichtungen oder die Bearbeitung möglicher Ansprüche eine längere Aufbewahrung erfordern.Ihre Daten können in streng begrenztem Umfang an Tochtergesellschaften und Dienstleister von Lacoste weitergegeben werden, die an der Organisation des Gewinnspiels beteiligt sind.Gemäß den geltenden Datenschutzbestimmungen haben Sie das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung Ihrer Daten, Widerspruch und Datenübertragbarkeit sowie das Recht, Anweisungen zum Umgang mit Ihren Daten nach Ihrem Tod festzulegen. Sie können diese Rechte über das Kontaktformular (auf der Website des Lacoste-Onlineshops) ausüben, indem Sie „Personenbezogene Daten“ auswählen.Sie haben außerdem das Recht, eine Beschwerde bei der <strong>Österreichischen Datenschutzbehörde (DSB)</strong> einzureichen. Weitere Informationen zur Verarbeitung Ihrer Daten finden Sie in unserer <a target=\\"_blank\\" rel=\\"noreferrer noopener nofollow\\" href=\\"https://www.lacoste.com/at/privacy.html\\">Datenschutzrichtlinie</a>.","optin_legal":"Ich stimme der Teilnahme am Gewinnspiel zu und akzeptiere damit die Teilnahmebedingungen des Gewinnspiels.","optin_member":"Ich stimme der Anmeldung zum Lacoste-Treueprogramm zu, sofern ich noch kein Mitglied bin. Durch Ankreuzen dieses Kästchens willige ich ein, dass meine übermittelten personenbezogenen Daten verwendet werden, damit ich meine Angebote und exklusiven Mitgliedervorteile erhalte und über Neuigkeiten der Marke informiert werde","privacy_link":"https://www.lacoste.com/at/privacy.html","legals_content":"## 1. Begriffsbestimmungen\\n\\nUnvoreingenommen hinsichtlich anderer Definitionen in diesen Nutzungsbedingungen („Bedingungen“) haben die nachstehend definierten Begriffe die ihnen zugewiesene Bedeutung, in Einzahl oder Mehrzahl.\\n\\n**Leistungen:** Bezieht sich auf die digitalen oder physischen Hilfsmittel, die von der Brand den Nutzern als Teil der Operationen angeboten oder verkauft werden und die mit einem NFT verbunden sein können.\\n\\n**Nutzungsbedingungen und -bestimmungen:** Bezieht sich auf die Allgemeinen Geschäftsbedingungen für die Nutzung der Plattform.\\n\\n**Unternehmen:** Bezieht sich auf das Unternehmen, das in den rechtlichen Hinweisen genannt ist.\\n\\n**Konto:** Bezieht sich auf das Konto, das der Nutzer bei seiner Registrierung auf der Plattform erstellt hat.\\n\\n**Brands:** Bezieht sich auf professionelle juristische Organisationen, die Operationen über die Lösung durchfüh
