ystemausfällen.\\n\\nIn Anbetracht der Natur des Internets und der Telekommunikationsnetze hat das Unternehmen eine Verpflichtung der Mittel, nicht der Ergebnisse.\\n\\nDas Unternehmen ist nicht haftbar für:\\n\\n* Ausfälle, Fehlfunktionen oder Cyberangriffe, die sich seiner Kontrolle entziehen.\\n\\n* Technische oder IT-Probleme, die nicht mit dem Betrieb von dem Unternehmen zusammenhängen, einschließlich solcher, die die zugrunde liegende Blockchain betreffen.\\n\\n* Verlust von Nutzerdaten, der nicht dem Unternehmen zuzuschreiben ist, wie z. B. Phishing oder Hacking aufgrund von Fahrlässigkeit des Nutzers.\\n\\n* Unbefugte oder illegale Nutzung der Lösung durch Nutzer, Marken oder Dritte.\\n\\n* Ereignisse höherer Gewalt im Sinne des französischen Rechts (Artikel 1218 des Zivilgesetzbuchs).\\n\\n#### Keine Garantien in Bezug auf Transaktionen und Vorteile\\n\\nDas Unternehmen garantiert oder bewertet nicht die Legitimität, Authentizität, Seriosität oder Professionalität der Marken oder ihrer Tätigkeiten.\\n\\nDas Unternehmen kann nicht haftbar gemacht werden für:\\n\\n* Von Marken in der Lösung veröffentlichte Inhalte, die gegen Gesetze oder Vorschriften verstoßen oder einem Nutzer oder Dritten Schaden zufügen, es sei denn, das Unternehmen wird wie in Abschnitt 8 beschrieben benachrichtigt.\\n\\n* Die Qualität oder Konformität der von den Marken über die Lösung angebotenen Vorteile.\\n\\n* Die Risiken im Zusammenhang mit NFT-Diensten sind in Anhang I aufgeführt.\\n\\n## 6. Benutzerverpflichtungen\\n\\n#### Benutzerverpflichtungen\\n\\nAls Gegenleistung für die Bereitstellung der Lösung durch das Unternehmen stimmen die Benutzer zu:\\n\\n* Sie müssen mindestens 18 Jahre alt sein oder die Erlaubnis der Eltern oder des gesetzlichen Vertreters haben.\\n\\n* Bei der Interaktion mit der Lösung genaue, wahrheitsgemäße und fehlerfreie Angaben machen und diese Informationen auf dem neuesten Stand halten. Eine Identitätsüberprüfung (z. B. KYC) kann zur Einhaltung der Gesetze zur Bekämpfung der Geldwäsche (AML) erforderlich sein.\\n\\n* Halten Sie die geltenden Gesetze und Vorschriften ein, wahren Sie die öffentliche Ordnung und befolgen Sie die Richtlinien der Marke.\\n\\n* Vermeiden Sie betrügerische Aktivitäten.\\n\\n* Die Lösung entsprechend ihrem Zweck zu nutzen.\\n\\n#### Verbotenes Verhalten\\n\\nNutzer dürfen nicht:\\n\\n* die Funktionalität der Lösung unterbrechen, aussetzen, verlangsamen oder behindern.\\n\\n* Illegale Inhalte veröffentlichen, einschließlich Hassreden, Diskriminierung, Gewalt oder Inhalte, die gegen geistiges Eigentum oder die guten Sitten verstoßen.\\n\\n* In die IT-Systeme von dem Unternehmen eindringen oder versuchen, in diese einzudringen.\\n\\n* Die Infrastruktur von dem Unternehmen überlasten.\\n\\n* Sicherheitsmaßnahmen verletzen.\\n\\n* Die Lösung oder ihre digitale Infrastruktur kopieren, sich aneignen oder missbrauchen.\\n\\nDie Nutzer stellen das Unternehmen von Beschwerden, Ansprüchen oder Klagen frei, die sich aus Verstößen gegen die Nutzungsbedingungen ergeben.\\n\\n## 7. Benachrichtigung\\n\\nBeschwerden über die Verwendung der Lösung, einschließlich Meldungen über illegale Inhalte, müssen an <contact@cohort.xyz> gerichtet werden und folgende Angaben enthalten:\\n\\n* Vollständiger Name und E-Mail-Adresse.\\n\\n* Einzelheiten der Beschwerde und Ort des Inhalts.\\n\\nDas Unternehmen wird solche Beschwerden umgehend prüfen und kann zusätzliche Dokumente anfordern, um das Problem zu lösen. Eine Nichtbeantwortung kann zu einer einseitigen Lösung durch das Unternehmen führen.\\n\\n## 8. Dauer, Aussetzung und Beendigung\\n\\n#### Dauer\\n\\nDie Bedingungen bleiben in Kraft, solange Nutzer auf die Lösung zugreifen.\\n\\n#### Aussetzung und Beendigung\\n\\nDie Nichteinhaltung der Bedingungen kann nach einer Untersuchung zu einer vorübergehenden Aussetzung oder Kündigung führen.\\n\\nDie Nutzer können ihre Konten jederzeit löschen, wodurch ihr Zugang zur Lösung beendet wird. Regulatorische Änderungen, die sich auf den Betrieb von Unternehmen auswirken, können ebenfalls zu einer automatischen Beendigung führen.\\n\\nDas Unternehmen haftet nicht für Entschädigungen bei Beendigung der Bedingungen.\\n\\n## 9. Geistiges Eigentum\\n\\nDie Lösung und alle ihre Funktionen sind das geistige Eigentum von dem Unternehmen oder Brands. Den Nutzern wird eine nicht-exklusive, nicht übertragbare und widerrufbare Lizenz für den persönlichen Gebrauch gewährt. Das Eigentum an den NFT-Urheberrechten verbleibt bei den Brands.\\n\\n## 10. Persönliche Daten\\n\\nDie Nutzung der Lösung bringt die Erfassung und Verarbeitung personenbezogener Daten durch die Brand in Übereinstimmung mit der GDPR und den französischen Datenschutzgesetzen mit sich.\\n\\n## 11. Streitigkeiten und Schlichtung\\n\\n#### Streitigkeiten\\n\\nStreitigkeiten müssen über <support@cohort.xyz> eingereicht werden. Verbraucher in der EU können auch den Schlichtungsdienst der Europäischen Kommission unter ec.europa.eu/consumers nutzen.\\n\\n#### Geltendes Recht\\n\\nDie Bedingungen unterliegen französischem Recht mit den französischen Gerichten als Zuständige.","id":"at/de","code":"de-at","iso":"de_AT"}},"prefixDefaultLocale":true,"trailingSlash":true},"site":{"locale":"gb/en","entry":{"corner":{"report":"Report","like":"Like","unlike":"Unlike","reported":"Reported","share":"Share"},"pending":{"text":"Pending approval"},"likes":{"text":"Likes"},"like":{"text":"Like"},"share":{"text":"share"},"dialog":{"text":"Thank you for your creation! The Lacoste team is currently reviewing it. If it is approved, it will be published within a maximum of 72 hours. Feel free to vote for your favorite creations in the gallery.","continue":"Continue"},"link_copied":"Link copied !"},"gallery":{"load":{"more":"Load more"},"filters":{"season1":"Contest #1 (Polos)","reset":"Reset filters","product":"By Product","competing":"Competing","recent":"Most Recent","filter":"Filter","button":"Filters","season2":"Contest #2 (Shirts)","all":"All","sor ew our <a target=\\"_blank\\" rel=\\"noreferrer noopener nofollow\\" href=\\"https://gdpr.eu/wp-content/uploads/2019/01/Our-Company-Privacy-Policy.pdf\\">Privacy Policy</a>."},"meta":{"description":"Create the polo of your dreams with the Lacoste co-creation tool.","_entry_description_":"Vote for this creation and create your own model!","title":"Lacoste - Members Experience","_entry_title_":"Lacoste - Entry #{INDEX}"},"oldbrowser":{"description":"The device or browser you’re using is not up to date. Please try another browser or device to access this content.","title":"Sorry"},"terms":{"title":"Cocreation Challenge Rules and Eligibility","body":"## 1. ORGANIZER\\n\\nThe company Lacoste E-commerce S.A.S, hereinafter referred to as the \\"Organizer,\\" a simplified joint-stock company under French law with a capital of 368,400 euros, whose registered office is located at 31-37 Boulevard de Montmorency, 75016 Paris, France, and registered in the Paris Trade and Companies Register under the number 403 285 513, is organizing a free contest with no purchase obligation (hereinafter referred to interchangeably as the \\"Cocreation Challenge\\" or the “Game” or the “Contest”).\\n\\n## 2. CONDITIONS OF PARTICIPATION\\n\\nThe Game and the interpretation of these rules are subject to French law, subject to the mandatory application of consumer law in the country of residence of each participant. By participating in the Game, participants accept these rules without reservation and agree to abide by its provisions. Failure to comply with any of the conditions will result in the cancellation of participation.\\n\\n**2.1 Conditions for Participation in the Game**\\n\\nThe Game is accessible only via the website membersexperience-create.lacoste.com from 06/05/2025 to 06/06/2025 inclusive, depending on the country as per the dates mentioned in each country’s communications.\\n\\nParticipation in the Game is open to any individual during the period of the Game (the \\"Participant\\").\\n\\nAccess to the Game is prohibited for directors and employees, as well as their direct family members, of the Organizer and any company controlled by, controlling, or jointly controlled with the Organizer (as per Article L. 233-3 of the French Commercial Code) and any person who has collaborated or is collaborating in organizing the Game, up to the 6th degree of kinship.\\n\\nAny Participant under the age of eighteen (18) must obtain prior authorization from a parent or legal guardian to participate in the Game and accept these rules. The Organizer reserves the right to request proof of this authorization and, if necessary, to disqualify any Participant who does not provide such authorization within two (2) business days of the request.\\n\\nThe Game is open to any individual residing in the following countries: United Kingdom, France, Germany, Switzerland, Spain, Portugal, Belgium, Netherlands, Italy, USA.\\n\\n**2.2 Validity of Participation**\\n\\nThe Participant agrees to provide accurate and truthful information to the Organizer in good faith, under penalty of exclusion from the Contest and, if applicable, loss of the Winner status.\\n\\nThe Organizer reserves the right to conduct any verification to ensure compliance with these rules, particularly to exclude any Participant who has committed abuse or attempted fraud, without being obliged to systematically verify all Game entries. The Organizer may limit this verification to the winner\'s participation, as defined below.\\n\\nIt is strictly forbidden, by any means, to alter or attempt to alter the mechanisms provided for the Contest, particularly to modify the results or influence the validity of the instant win or the designation of a winner by automated or unfair means. If it is found that a Participant has apparently won a prize in violation of these rules by fraudulent means, such as automated searches or the use of algorithms, or by any means other than those described by the Organizer on the website or in these rules, the concerned prize will not be awarded and will remain the property of the Organizer, without prejudice to any legal action that may be taken against the Participant by the Organizer or third parties.\\n\\nThe Organizer reserves the right to cancel the participation of anyone who registers multiple times under different identities or provides inaccurate information.\\n\\nThe Participant authorizes all checks regarding their identity, email address, and phone number. In this regard, the Organizer reserves the right to request from the Participant a copy of documents verifying these elements.\\n\\nAny individual is deemed to have read, understood, and accepted the rules, without reservation, as soon as they access and register for the Game.\\n\\n## 3. PRINCIPLES OF THE GAME AND WINNER DESIGNATION\\n\\nTo participate in the Contest and attempt to win, the Participant must:\\n\\n* Be a member of the \\"Le Club Lacoste\\" or “Lacoste Members” loyalty program and accept the conditions of this program according to their country of residence.\\n\\n* Share their co-creation in accordance with any instructions provided by the Organizer and submit it for user voting.\\n\\nThe Organizer will publish creations that comply with the following rules:\\n\\n* The creation must not contain any religious connotations, hateful messages, or sexual content.\\n\\n* The creation must respect Lacoste’s brand DNA (to be determined at the Organizer’s sole discretion) and not promote competing brands.\\n\\nThe Organizer reserves the right to remove any creations that violate these rules or for any reason to be determined at the Organizer’s sole discretion.\\n\\nCreations will be published within a maximum of 24 hours following participation.\\n\\nThe Organizer will choose the winner from all creations that received at least one vote. A female model and a male model will be selected at the end of the co-creation period, resulting in 2 winners at the end of the co-creation period.\\n\\nOnce the models are selected, they will be subject to validation by the Legal and Product teams. The models may be modified from the user\'s initial proposal. Creations will thus be adapted by the Organizer.\\n\\nParticipants whose creations are selected as winners must sign a rights transfer agreement (including a guarantee of peaceful enjoyment) with the Organizer.\\n\\n## 4. PRIZES\\n\\nThe name of the winner will be announced by the Organizer between 12/06/2025 and 13/09/2025 from among the Participants who shared their creations.\\n\\nThe two designated winners will receive:\\n\\n* The creation of their t-shirt in the size of their choice.\\n\\nThe prizes cannot, under any circumstances, be transferred for monetary consideration to third parties. It is explicitly stated that the winner may not request or demand a modification of the awarded prize, particularly in terms of its content or execution date, nor a cash refund or any other form of compensation, nor replacement by an equivalent prize. No cash or other form of equivalent value will be offered in exchange for the prize.\\n\\nThe Organizer reserves the right, at its discretion, to modify the prize in the event of circumstances beyond its control, such as a partner or supplier failure, stock shortages, without limitation, and to offer the winner a prize of equivalent or higher nature or value.\\n\\n## 5. PRIZE DELIVERY\\n\\nWithin thirty-five (35) days following the designation of the winner, each winner will be individually informed of the results by an email from the Organizer, providing details on how to claim the prize.\\n\\nThe instructions for claiming the prize will be indicated in this message. The winner must provide their full name, first name, size (depending on the prize won), and postal address for the delivery of the prize.\\n\\n* The t-shirt with the winning creation: The winner will be contacted to provide the postal address where they would like to receive the t-shirt. The winning t-shirt will be delivered from once it has been produced.\\n\\nThe winner must verify that the prize has not been damaged (packaging or the prize itself) during transport upon signing the delivery receipt. If any damage is found, the winner may refuse the prize and file a written complaint with the Organizer within five (5) days. If they accept the prize, they must make any necessary reservations on the delivery receipt given to the carrier.\\n\\nShould the winner fail to comply with these rules, fail to collect or be unable to collect the prize, for any reason, or fail to prove their identity within five (5) business days following the Organizer\'s request, or if the provided contact details are invalid, false, or erroneous, the winner will be deemed to have forfeited their prize, and no compensation will be granted.\\n\\nA minor winner will also forfeit the prize if they cannot prove to the Organizer within the aforementioned period that they have obtained authorization from a parent or legal guardian to claim the prize.\\n\\nThe prize will be sent directly to the winner at the address they provided to the Organizer.\\n\\n## 6. INTELLECTUAL PROPERTY\\n\\nThe Participant hereby grants to the Organizer, as of the date of acceptance of these terms, the economic rights to the Creation in the Territory and for the Duration specified herein for the manufacturing, distribution, sale, and marketing of products featuring the Creation, and for the use of the Creation according to the provisions of these terms and conditions outlined below.\\n\\n#### (i) Granted Rights\\n\\nThe granted rights include:\\n\\n* The right to reproduce or have reproduced, to copy or have copied, to fix or have fixed, to record or have recorded, to manufacture or have manufactured, to publish or have published, particularly for direct or indirect commercialization, without limitation in quantity, all or part of the Creation in black and white or color, in any format and framing ratio, by any known or unknown process, and notably, but not limited to, by any graphic, mechanical, chemical, holographic, electronic, digital, analog, audiovisual, magnetic process, and on any media, known or unknown, current or future, such as paper, cardboard, metal, plastic, screen, textile, clothing, leather, digital media, magnetic media, film, video recording, and/or interactive or non-interactive videodisc, CDI, CD/DVD-Rom, Video CD, Blu-ray Disc, digital disc, hard drive, USB key, memory card, flash memory, SD card, and similar, in mobile telephony, image database, image bank, as well as on any private or open telecommunication network, national or international, including Intranet, Internet (notably websites), social networks, and any existing or future virtual environments (such as the metaverse) or any other;\\n\\n* The right to represent or have represented, to broadcast or have broadcasted to any public, to communicate or make available to the public all or part of the Creation, by any process and on any medium known or unknown today, current or future, in any location, in any format, for public exploitation or private use, whether free, paid, or by subscription, notably but not limited to, by any communication network, fixed and/or mobile radio communication system or others, including by cinema, video, television broadcast, analog transmission, terrestrial, satellite, or cable, wireless technology or mobile telephony, and more generally, by any other telecommunication means, including Intranet, Internet, social networks, and any existing or future virtual environments (such as the metaverse) or any other;\\n\\n* The right to adapt, correct, modify, evolve all or part of the Creation by any known or unknown means or process, and notably, but not limited to, by any of the communication modes mentioned above, including the right to create new versions of the Creation or new creations from the Creation, the right to integrate the Creation into any existing or future work, and to create derivative products, on any medium and by any means, as well as the right to modify, reframe, colorize, arrange, assemble, condense, mix, migrate, edit, animate, delete, or add a sound or visual element (logo, trademarks), the right to interface them with any software, hardware, or database or any other means of telecommunication, including Intranet, Internet, social networks, and any existing or future virtual environments (such as the metaverse) or any other.\\n\\nGiven the purpose and destination of the Creation, technical constraints, and customary practices in the field, the Creator acknowledges and accepts that their name may not be mentioned on the Creation or any other creation incorporating it.\\n\\n#### (ii) Third-Party Assignment\\n\\nThe Participant expressly authorizes the Organizer to assign to any third party of its choice, in any form, including by sale, license, or any other type of contract, all or part of the rights granted above on the Creation, temporarily or permanently, and to broadcast, distribute, and market it on any media and to any public within the limits of the rights granted herein.\\n\\nIn such cases, the assignees of the Organizer must respect the terms of this transfer.\\n\\n#### (iii) Registration of Creations\\n\\nThe Participant expressly authorizes the Organizer (or any third-party assignee of its rights) to register worldwide in their name and on their behalf, all or part of the components of the Creation and its derivatives or adaptations as designs or models and/or trademarks and/or copyright and/or patents, or under any other title, in the Territory and for the entire duration of the protection of the economic rights of the author.\\n\\nWhen registering designs and models based on the Creation, the Participant expressly waives their right to be mentioned as the author of the registered designs or models.\\n\\n#### (iv) Exclusivity\\n\\nThis transfer is granted exclusively by the Participant to the Organizer.\\n\\nThe Participant agrees not to personally exploit the Creation for which they have transferred their rights to the Organizer under these terms.\\n\\nThe Parties expressly agree to exclude the application of Article L.131-5-2 of the French Intellectual Property Code, and agree that the Organizer will have no obligation to exploit the Creation.\\n\\n#### Duration\\n\\nThis transfer is granted for the entire duration of the protection of the author\'s economic rights attached to the Creation.\\n\\n#### Territory\\n\\nThis transfer is granted for worldwide use.\\n\\n#### Recognition of Rights\\n\\nThe Participant acknowledges that the Organizer belongs to a group of companies holding trademarks representing different crocodiles worldwide.\\n\\nThe Participant agrees never to challenge the validity of the intellectual property rights of the Organizer and its group companies and to fully respect these rights.\\n\\nThe Participant agrees never to claim ownership or use of any trademarks or intellectual property rights belonging to the Organizer or any of its group companies.\\n\\n#### Warranty\\n\\nThe Creator guarantees the Organizer peaceful, full, and complete enjoyment of the rights granted on the Creation against any disturbance, dispute, claim, or eviction, including but not limited to:\\n\\n* that they will be legally able to transfer the rights specified herein without violating any prior commitments;\\n\\n* that the Creation on which the intellectual property rights will be transferred to the Organizer will not infringe third-party rights, will not constitute counterfeiting, will not be contrary to good morals or the law, will not infringe third-party image rights, and will not cause any disturbance to a third party\'s enjoyment of their property, and that as of the date of the rights transfer to the Organizer, no third-party claims have been made;\\n\\n* their status as the author or exclusive holder of the intellectual property rights on the Creation, or at the very least, that they have obtained from any third party involved in the creation of the Creation the exclusive transfer of all intellectual property rights and/or all necessary authorizations for the Organizer to exploit them under the conditions provided herein;\\n\\n* that all persons depicted in the Creation, whether identifiable or not, have given their written consent to the Organizer\'s exploitation of the Creation depicting them under the conditions set forth herein and in compliance with applicable legal provisions.\\n\\nThe Participant will indemnify the Organizer against any claims and cover all expenses (including legal fees) incurred by the Organizer due to the Participant\'s failure to comply with any of the guarantees defined in this Agreement.\\n\\nIn particular, the Participant will bear any damages the Organizer may be ordered to pay by a court ruling that the Creation or its exploitation constitutes an act of infringement and/or unfair competition.\\n\\nConventional indemnities resulting from a settlement under Articles 2044 and following of the French Civil Code will also be borne by the Participant.\\n\\n#### (v) Defense of Rights\\n\\nThe Participant agrees to promptly inform the Organizer as soon as they become aware of any unauthorized use of the Organizer\'s intellectual property rights concerning the Creation, including counterfeiting or any infringement.\\n\\nIn such cases, the Participant will provide reasonable assistance to the Organizer in defending its intellectual property rights on the Creation.\\n\\nOnly the Organizer is entitled to take any necessary and appropriate measures regarding any violation or threat of violation of its intellectual property rights, at its sole discretion and expense. Damages recovered following such proceedings will belong to the Organizer.\\n\\nThe Organizer cannot be held liable for any damages the Participant may suffer due to acts of counterfeiting or intellectual property infringement committed by third parties.\\n\\n## 7. LIABILITY\\n\\nThe Organizer of the Contest cannot be held liable if, due to force majeure or events beyond its control, or due to justified necessity, it is forced to cancel, shorten, extend, postpone, or modify the conditions of the Contest. Its liability cannot be engaged as a result. It reserves the right in any case to extend the participation period.\\n\\n## 8. DISPUTES AND LIABILITY\\n\\nThe Game Organizer shall not be held liable if, in the event of force majeure or circumstances beyond its control or for justified necessity, it is compelled to cancel, shorten, extend, postpone, or modify the conditions of the Game, and no liability shall be incurred in such cases. The Organizer reserves the right, in all cases, to extend the participation period.\\n\\nIn particular, the Organizer or its service providers disclaim any liability if the Site becomes unavailable during the Game or in the event of malfunctions not attributable to it, or if participants\' information is destroyed for reasons beyond its control.\\n\\nNo telephone or written inquiries regarding the interpretation or application of these rules, the mechanisms, or the Game\'s procedures, or the winner(s), will be answered.\\n\\nParticipation in the Game implies full acceptance, without any restriction or reservation, of these rules. As such, the Organizer reserves the right to exclude from the Game any person disrupting its conduct (including in cases of cheating or fraud) and to disqualify the Participant or winner from any potential entitlement to a prize.\\n\\nThe Organizer cannot be held liable in the event of force majeure (strikes, weather conditions, etc.) preventing the winner from fully or partially enjoying the prize.\\n\\nAdditionally, the Organizer shall not be held liable for any lost emails or postal mail.\\n\\nThe Organizer may cancel all or part of the Game if it appears that fraud has occurred in any form, such as exceeding the authorized number of participations in the Game. In this case, the Organizer reserves the right not to award prizes to the fraudsters and/or to take legal action against them.\\n\\nThe Game and the interpretation of these rules are governed by French law. Any disputes will be resolved by the competent courts.\\n\\n## 9. PERSONAL DATA\\n\\nLacoste (including Lacoste Operations S.A., Lacoste S.A., Lacoste E-commerce S.A.S., and Lacoste France S.A.S.), as the data controller, processes the personal data of Participants to manage their participation in the Game, designate the winner, and deliver the prize.\\n\\nThe data collected during participation in the Game is necessary for this process and is intended for the relevant Lacoste departments and, if applicable, its subcontractors or service providers.\\n\\nAll information provided by participants is intended solely for the Organizer, the data controller. However, this information may be transmitted to the Organizer\'s partners for commercial prospecting if the Participant has given consent by checking the appropriate box.\\n\\nThe collected data will be retained until the winner is designated, except for the winner\'s data, which will be kept until the final delivery of the prize.\\n\\nIf the Participant agrees to receive commercial offers from Lacoste and/or join the Lacoste Club, an email will be sent with details about the processing of their personal data and their rights.\\n\\nIn accordance with current legislation, Participants have the right to access, rectify, or delete their data, restrict its processing, object to its processing, request data portability, and define instructions regarding the use of their data after death. These rights can be exercised by emailing <dataprotection@lacoste.com> or by postal mail to the Legal Department / Personal Data Manager at 31 BD DE MONTMORENCY, 75016 PARIS (France), accompanied by a copy of an identity document.\\n\\nParticipants also have the right to lodge a complaint with a supervisory authority.\\n\\nThe winner authorizes the use of their first and last name on any media used by the Organizer, without receiving any compensation, right, or benefit other than the awarded prize.\\n\\n## 10. REIMBURSEMENT OF PARTICIPATION FEES\\n\\nSince participation in the Game is free and without any obligation to purchase goods or services, no reimbursement of expenses incurred for participation will be made, except for the transmission of the rules by postal mail.\\n\\nParticipation in the Game via a fixed or mobile internet connection that is free or on a flat- rate basis (cable, ADSL, fiber optic, mobile internet package) will not result in any reimbursement, as the Participant incurs no additional costs to connect and participate in the Game.\\n\\n## 11. RULE AMENDMENTS\\n\\nThe rules are accessible free of charge and at any time during the challenges at:\\n\\n* [https://www.membersexperience-create.lacoste.com](https://www.membersexperience-create.lacoste.com)\\n\\nThe Organizer reserves the right to amend these rules at any time through an addendum, published on the website."},"legal":{"title":"Terms and Conditions of Use","body":"## 1. Definitions\\n\\nWithout prejudice to other definitions in these Terms and Conditions of Use («Terms»), the terms defined below shall have the meanings assigned to them whenever capitalized, in singular or plural form.\\n\\n**Benefits:** Refers to the digital or physical utilities offered or sold by the Brand to Users as part of the Operations and which may be associated with an NFT.\\n\\n**T&Cs:** Refers to the General Terms and Conditions of Use of the platform.\\n\\n**Cohort:** Refers to Cohort, the company identified in the legal notices.\\n\\n**Account:** Refers to the account created by the User during their registration on the platform.\\n\\n**Brands:** Refers to professional legal entities conducting Operations through the Solution.\\n\\n**NFT:** Refers to non-fungible tokens compliant with ERC-721 and ERC-1115 standards or other similar standards and stored on a Blockchain.\\n\\n**Operations:** Refers to the promotional campaigns conducted by Brands using the Solution.\\n\\n**Outage:** Refers to a technical issue preventing proper access to or use of the platform.\\n\\n**Smart Contract:** Refers to the intelligent contract in the form of computer code that facilitates transactions on the blockchain.\\n\\n**Solution:** Refers to the technological solution developed by Cohort, enabling Brands to create and track Operations.\\n\\n**Users:** Refers to the clients of the Brands who participate in the Operations via the Solution.\\n\\n## 2. Purpose and Scope\\n\\nThese Terms aim to define the conditions for secure access and use of the Solution by Users.\\n\\nCohort acts as a technical intermediary between Brands and Users, with its role limited to managing the Solution. Consequently, Cohort is never a party to transactions carried out by the Brands. Similarly, Advantages and NFTs are issued and sold by Brands to Users and never by Cohort.\\n\\nTherefore, these Terms do not govern any relationship of any kind between Brands and Users.\\n\\n## 3. Acceptance and Modifications\\n\\n#### Acceptance\\n\\nThe Terms are accessible at any time on the Solution and apply to all interactions with the Solution. They shall prevail over any other version or contradictory document.\\n\\nUsers agree to read, fully accept, and comply with these Terms by ticking the corresponding box.\\n\\n#### Modifications to the Terms\\n\\nTo enhance the Solution\'s features and quality, Cohort may add, remove, or replace functionalities at any time.\\n\\nCohort may modify the Terms as needed and will make its best effort to inform Users of changes before they take effect.\\n\\nIn case of substantial modifications (including the removal of a feature) affecting Users, Cohort commits to notifying them within a reasonable timeframe before the changes take effect. During this period, Users may terminate their account, provided they fulfill existing commitments.\\n\\n## 4. Access to the Solution\\n\\nThe Solution is integrated into Users’ accounts with the Brands. Upon login, Users must provide all required information to both Cohort and the Brand. Incomplete registrations will not be validated. Cohort reserves the right to verify provided information and reject invalid and/or incomplete requests, with no entitlement to compensation.\\n\\nBy interacting with the Solution, Users guarantee they are individuals acting as consumers under applicable laws and have full legal capacity to agree to these Terms.\\n\\nAccess to the Solution is also subject to compliance with applicable Brand policies. Cohort is not responsible for registration or sales refusals due to breaches of Brand policies.\\n\\n## 5. Cohort’s Commitments\\n\\n#### Guarantees Related to the Solution’s Operation\\n\\nCohort will make its best efforts to provide the Solution and ensure its accessibility and proper functioning.\\n\\nThe Solution is intended to be available 24/7, except in cases of force majeure, unforeseen third-party actions, or necessary maintenance, updates, or system failures.\\n\\nGiven the nature of the internet and telecommunications networks, Cohort has an obligation of means, not results.\\n\\nCohort is not liable for:\\n\\n* Failures, malfunctions, or cyberattacks beyond its control.\\n\\n* Technical or IT issues unrelated to its operations, including those involving the underlying Blockchain.\\n\\n* Loss of User data not attributable to Cohort, such as phishing or hacking due to User negligence.\\n\\n* Unauthorized or illegal use of the Solution by Users, Brands, or third parties.\\n\\n* Force majeure events as defined by French law (Article 1218 of the Civil Code).\\n\\n#### No Guarantees Related to Transactions and Advantages\\n\\nCohort does not guarantee or assess the legitimacy, authenticity, seriousness, or professionalism of Brands or their operations.\\n\\nCohort cannot be held liable for:\\n
